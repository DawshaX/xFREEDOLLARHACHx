# TEST92 — تمريرة التفعيل واحد-واحد (أمر المالك: «اداة اداة احسن واسرع»):
# pip tools مباشرة على العقدة (مستقلة عن المخزن) + provision بايثون + الجرد
# الحي. كل نتيجة بتنزل في state/tool-pass-log.txt (المسار المعمول به —
# gh api logs EOF مقاس).
name: "TEST92 — تفعيل واحد-واحد: pip tools + provision + جرد"
on:
  push:
    paths:
      - ".github/workflows/kali-tool-pass.yml"
permissions:
  contents: write
concurrency:
  group: kali-tool-pass
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - uses: actions/checkout@v4
      - name: provision أدوات بايثون (POST طويل — لحد 15د)
        continue-on-error: true
        run: |
          L=state/tool-pass-log.txt
          echo "=== TEST92 provision $(date -u +%FT%TZ) ===" > $L
          curl -s -m 900 -X POST "$HUB/api/ops/tools/python/provision" \
            -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{}' >> $L 2>&1 || echo "PROVISION_REQ_FAIL" >> $L
          echo "" >> $L
          true
      - name: تثبيت واحد-واحد (مسلسل — كل أداة لوحدها)
        continue-on-error: true
        run: |
          L=state/tool-pass-log.txt
          for tool in pgcli socialanalyzer pentestly ssrfmap fernet subzy gotator osintgram netexec routersploit photon; do
            echo "--- INSTALL $tool $(date -u +%T) ---" >> $L
            curl -s -m 470 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" >> $L 2>&1 || echo "REQ_FAIL:$tool" >> $L
            echo "" >> $L
          done
          echo "=== INSTALLS DONE $(date -u +%FT%TZ) ===" >> $L
          true
      - name: الجرد الحي (46 أداة بنسخها)
        continue-on-error: true
        run: |
          L=state/tool-pass-log.txt
          echo "=== INVENTORY $(date -u +%FT%TZ) ===" >> $L
          curl -s -m 320 "$HUB/api/kali-env/inventory" -H "x-nova-token: $TOKEN" -o /tmp/inv.json || true
          jq '{present, total, measured, measuredOn, missing}' /tmp/inv.json >> $L 2>/dev/null || head -c 400 /tmp/inv.json >> $L || true
          echo "" >> $L
          curl -s -m 280 "$HUB/api/kali-env/tools?fresh=$RANDOM" -H "x-nova-token: $TOKEN" -o /tmp/tools.json || true
          jq '{present, total}' /tmp/tools.json >> $L 2>/dev/null || true
          true
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot"; git config user.email "nova@bot.local"
          git add -f state/tool-pass-log.txt
          git commit -m "state: TEST92 tool pass [skip ci]" || true
          git pull --no-rebase --no-edit origin arena/9552f54d-xfreedollarhachx
          git push origin HEAD:arena/9552f54d-xfreedollarhachx
          exit 0
