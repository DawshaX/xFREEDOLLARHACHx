# TEST92b — التفعيل واحد-واحد (أمر المالك: «اداة اداة احسن واسرع») — الجزء A:
# النصف الأول من الـ47 الناقصة على عقد الأسطول الحية (الأسطول قام 04:02
# بالمخزن الكامل — metasploit msfconsole جاهز مقاس). السلسلة الكاملة في
# المثبت: STORE → GitHub → pip → clone → apt — كل أداة بتلاقي أطبق مصدر.
name: "TEST92d — تفعيل A على 15 عقدة حية"
on:
  push:
    paths:
      - ".github/workflows/kali-tool-pass.yml"
permissions:
  contents: write
concurrency:
  group: kali-tool-pass
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - uses: actions/checkout@v4
      - name: فحص العقد الحية أولًا
        run: |
          L=state/tool-pass-log.txt
          echo "=== TEST92b-A $(date -u +%FT%TZ) ===" > $L
          curl -s -m 60 "$HUB/api/ops/kali/nodes" -H "x-nova-token: $TOKEN" -o /tmp/nodes.json || true
          jq '{kaliNodeCount, tools: {total: .stats.total, ok: .stats.ok}}' /tmp/nodes.json >> $L 2>/dev/null || echo "NODES_FAIL" >> $L
          echo "" >> $L
          true
      - name: تثبيت واحد-واحد (25 — مسلسل)
        continue-on-error: true
        run: |
          L=state/tool-pass-log.txt
          for tool in metasploit-framework netexec crackmapexec steghide exiftool arp-scan ettercap sherlock amass sublist3r volatility empire cherrytree casefile dradis recordmydesktop wkhtmltopdf evilgrade maskprocessor rainbowcrack redis ltrace strace elfutils zsh; do
            echo "--- INSTALL $tool $(date -u +%T) ---" >> $L
            curl -s -m 120 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" >> $L 2>&1 || echo "REQ_FAIL:$tool" >> $L
            echo "" >> $L
          done
          echo "=== A DONE $(date -u +%FT%TZ) ===" >> $L
          true
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot"; git config user.email "nova@bot.local"
          git add -f state/tool-pass-log.txt
          git commit -m "state: TEST92b-A pass [skip ci]" || true
          git pull --no-rebase --no-edit origin arena/9552f54d-xfreedollarhachx
          git push origin HEAD:arena/9552f54d-xfreedollarhachx
          exit 0
