name: hunt live (real scan · permitted targets)

# الغرض: كل يوم، البرنامج بيقوم لوحده، ينصّب الأدوات الحقيقية، يفحص الأهداف
# المسموح بها في `ops/verify/targets.json`، ويكتب النتيجة + الأدلة في الريبو.
# مفيش سيرفر، مفيش كارت، ومفيش ادعاء: اللي في state/hunt-latest.json هو اللي حصل.
on:
  schedule:
    - cron: "25 */6 * * *" # كل 6 ساعات
  push:
    branches: [main]
    paths:
      - "scripts/hunt-live.mjs"
      # the publisher and the witness are part of this pipeline: changing either
      # one must re-run the job that depends on them, or the fix is unverified
      - "scripts/ci-commit.mjs"
      - "scripts/prove-published.mjs"
      - "ops/verify/targets.json"
      - ".github/workflows/hunt-live.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "host واحد بس (اختياري)"
        default: ""

permissions:
  contents: write

concurrency:
  group: hunt-live
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub keeps the commit a run was QUEUED with; a run that waits behind
      # concurrency: starts on state that is already old, decides its next step
      # from it, and then writes that stale state back over the newer one.
      # Measured: run 41905819968 queued 20:21:25 on 27a0fede, started 20:31:07
      # after the 20:30:56 index commit, and re-ran the same work (walkedFrom 0).
      - name: move to the current origin/${{ github.ref_name }} (a queued run starts on a stale commit)
        run: |
          git fetch --prune origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          git log -1 --format='now on %h · %s'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: install nmap (the only tool without a static release)
        continue-on-error: true
        run: |
          sudo apt-get -qq update >/dev/null || true
          sudo apt-get install -y -qq nmap >/dev/null || true
          nmap --version 2>&1 | head -1 || echo "nmap unavailable"

      - name: vendor the real toolchain
        env:
          # authenticated api.github.com: anonymous calls are rate-limited per
          # runner IP, and a 403 here reports as "0 tools" without an error
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-toolchain.mjs --into vendor/bin

      - name: PATH for the vendored binaries
        run: echo "$PWD/vendor/bin" >> "$GITHUB_PATH"

      # The vendorer never fails a build (a bad CDN must not stop a deploy), so a
      # green "vendor" step means "the script finished", not "the tools are here".
      # This step is the one that answers the real question, before any scanning.
      - name: prove the scanners are executable
        run: node scripts/check-toolchain.mjs --need=httpx,katana,nuclei

      - name: hunt
        run: node scripts/hunt-live.mjs ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}

      - name: measured summary
        run: |
          node -e '
            const r = require("./state/hunt-latest.json");
            const sev = Object.entries(r.totals.bySeverity).map(([k,v]) => `${k}: ${v}`).join(" · ") || "none";
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Hunt (measured)\n\n| | |\n|---|---|\n| findings | **${r.totals.findings}** |\n| high/critical | ${r.totals.rated} |\n| targets | ${r.totals.targets} |\n| severity | ${sev} |\n| tools | ${Object.entries(r.tools).map(([k,v])=>`${k}:${v}`).join(" · ")} |\n| at | ${r.at} |\n\n${r.says_ar}\n`);
            for (const f of r.findings.slice(0, 20)) console.log(`[${f.severity}] ${f.template} → ${f.matchedAt}`);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: hunt-findings
          path: |
            state/hunt-latest.json
            state/hunt/evidence
          retention-days: 30

      - name: commit the result (findings + evidence hashes)
        env:
          # a colon inside an unquoted YAML scalar ("chore(corpus): …") makes the
          # whole workflow file invalid — pass the message through env instead
          MSG: "chore(hunt): measured scan $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
        run: |
          node scripts/ci-commit.mjs --message "$MSG" state/hunt-latest.json state/hunt/evidence

      # ci-commit proves its own push landed, but a step that checks the promise
      # from outside is cheap and cannot share the same bug. The probe lives in
      # scripts/ so it can be run and tested by hand; a multi-line `node -e` inside
      # YAML is exactly the kind of thing that fails silently at parse time.
      - name: prove it landed (read the file back from origin)
        run: node scripts/prove-published.mjs state/hunt-latest.json --branch main

