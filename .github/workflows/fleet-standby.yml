# [fleet-standby] 14 عقدة أساسية + 6 احتياط تتفعل تلقائيًا — ضمان الأسطول مدى الحياة
# الطلب المالك 04:4xZ: «خليهم 14 عقدة + 6 احتياط ويتفعلو تلقائيًا».
# الآلية: كل 20د يقيس الأسطول الحي على الهَب. لو الأساسية (14) ناقصة → يحرق
# fleet-now بعدد الناقص (حتى 6). لو الاتصال انهار كليًا → موجة كاملة 14.
# العدادات: 14 أساسي · 20 سقف (14+6 احتياط تدخل لما أساسيات تقع).
name: fleet-standby
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: fleet-standby
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: قياس الأسطول الحي وتفعيل الاحتياط عند النقص
        env:
          TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
        run: |
          set -uo pipefail
          HUB="https://nova.waifly.com"
          for i in 1 2 3; do
            H=$(curl -s -m 20 "$HUB/api/kali-env/health?token=$TOKEN" || true)
            CONNECTED=$(echo "$H" | grep -oE '"connected":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            KALI=$(echo "$H" | grep -oE '"kaliReady":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            echo "قياس $i: connected=$CONNECTED kaliReady=$KALI"
            [ -n "$CONNECTED" ] && [ "$CONNECTED" -gt 0 ] 2>/dev/null && break
            sleep 10
          done
          CONNECTED=${CONNECTED:-0}
          if [ "$CONNECTED" -lt 14 ]; then
            NEED=$(( 14 - CONNECTED )); [ "$NEED" -gt 6 ] && NEED=6
            echo "الأسطول ناقص ($CONNECTED/14) → تفعيل $NEED عقدة احتياط"
            curl -s -m 20 -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              "${GITHUB_API_URL:-https://api.github.com}/repos/${{ github.repository }}/actions/workflows/fleet-now.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w "dispatch=%{http_code}\n"
          else
            echo "الأسطول سليم ($CONNECTED/14) — الاحتياط محجوز"
          fi
