# [fleet-standby] 10 عقد شغّالة + الباقي احتياط/بدايل متجدد دايمًا — ضمان الأسطول مدى الحياة
# تحديث 05:5xZ بطلب المالك: «خليهم 10 عقد بس والباقي احتياطي وبدايل وبيتجدد ديما».
# الشغل على self-hosted (عقد الكالي نفسها) — صفر دقائق hosted المحدودة.
# الآلية: كل 20د يقيس الأسطول الحي على الهَب. لو الأساسية (14) ناقصة → يحرق
# fleet-now بعدد الناقص (حتى 6). لو الاتصال انهار كليًا → موجة كاملة 14.
# العدادات: 10 شغّالة · أي زيادة = احتياط حي بيتجدد تلقائيًا لما شغّالة تقع.
name: fleet-standby
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: fleet-standby
  cancel-in-progress: false
jobs:
  watchdog:
    # self-hosted: على عقدة الكالي نفسها — مافيش استهلاك دقائق GitHub المحدودة
    runs-on: self-hosted
    steps:
      - name: قياس الأسطول الحي وتفعيل الاحتياط عند النقص
        env:
          TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
        run: |
          set -uo pipefail
          HUB="https://nova.waifly.com"
          for i in 1 2 3; do
            H=$(curl -s -m 20 "$HUB/api/kali-env/health?token=$TOKEN" || true)
            CONNECTED=$(echo "$H" | grep -oE '"connected":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            KALI=$(echo "$H" | grep -oE '"kaliReady":[0-9]+' | grep -oE '[0-9]+' || echo 0)
            echo "قياس $i: connected=$CONNECTED kaliReady=$KALI"
            [ -n "$CONNECTED" ] && [ "$CONNECTED" -gt 0 ] 2>/dev/null && break
            sleep 10
          done
          CONNECTED=${CONNECTED:-0}
          if [ "$CONNECTED" -lt 10 ]; then
            NEED=$(( 10 - CONNECTED )); [ "$NEED" -gt 6 ] && NEED=6
            echo "الأسطول ناقص ($CONNECTED/10) → تفعيل $NEED من الاحتياط"
            curl -s -m 20 -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              "${GITHUB_API_URL:-https://api.github.com}/repos/${{ github.repository }}/actions/workflows/fleet-now.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w "dispatch=%{http_code}\n"
          else
            echo "الأسطول سليم ($CONNECTED/10) — الاحتياط بيتجدد دايمًا"
          fi
