# TEST93p — المسار F: المتبقي الحقيقي على الأسطول كلّه (بعد فكس المرحلتين +
# retry البوابة + debs2 + ghidra/retdec + empire كامل). مسلسل واحد-واحد (الدرس:
# الازدحام بيقتل) — بعد ما store workflows تخلص (التاربولات لازم تكون مرفوعة).
name: "TEST93v-F4 — آخر 13 (subzy+gotator+faraday+dradis)"
on:
  push:
    paths:
      - ".github/workflows/kali-tool-pass-f.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kali-tool-pass-f
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت F (19 — واحد-واحد مسلسل)
        continue-on-error: true
        run: |
          L=state/tool-pass-f-log.txt
          echo "=== TEST93p-F $(date -u +%FT%TZ) ===" > $L
          for tool in fern maskprocessor pgcli routersploit socialanalyzer vulners subzy gotator evilgrade libreoffice faraday dradis king-phisher; do
            echo "--- INSTALL $tool $(date -u +%T) ---" >> $L
            curl -s -m 900 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" >> $L 2>&1 || echo "REQ_FAIL:$tool" >> $L
            echo "" >> $L
          done
          echo "=== F DONE $(date -u +%FT%TZ) ===" >> $L
          true
      - name: القياس النهائي الاتحادي (tools + inventory)
        continue-on-error: true
        run: |
          L=state/tool-pass-f-log.txt
          echo "=== FINAL MEASURE (union) $(date -u +%T) ===" >> $L
          curl -s -m 280 "$HUB/api/kali-env/tools?fresh=$RANDOM" -H "x-nova-token: $TOKEN" -o /tmp/tools.json || true
          jq '{present, total, measuredOn}' /tmp/tools.json >> $L 2>/dev/null || true
          echo "" >> $L
          true
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot"; git config user.email "nova@bot.local"
          git add -f state/tool-pass-f-log.txt
          git commit -m "state: TEST93p-F pass [skip ci]" || true
          git pull --no-rebase --no-edit origin arena/1aad5cfd-xfreedollarhachx
          git push origin HEAD:arena/1aad5cfd-xfreedollarhachx
          exit 0
