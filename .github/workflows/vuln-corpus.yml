name: vuln corpus (real NVD + KEV + EPSS)

# The program was always connected to the real feeds (NVD, GHSA, EPSS, CIRCL, OSV…)
# but each call pulled 5–10 records for a telemetry panel, so nothing accumulated.
# This job accumulates: it walks the actual NVD database, joins CISA KEV and FIRST
# EPSS on the CVE id, and publishes a corpus the app can query by product or CVE.
#
#   • every 30 min  → incremental (lastModStartDate = last run) → new CVEs land fast
#   • weekly        → full pass over the database
#
# Numbers are printed from the index file the ingest wrote. Nothing here is typed.

on:
  schedule:
    - cron: "*/30 * * * *" # incremental: pick up CVEs published/modified since last run
    - cron: "7 1,5,9,13,17,21 * * *" # hourly-ish retry band — GitHub delays scheduled runs
      # heavily on busy repos (measured: the */30 cron landed once per ~6-8h),
      # so extra slots give the ingest more chances to land fresh data.
    - cron: "0 3 * * 0" # weekly full pass
  push:
    branches: [main]
    paths:
      - ".github/workflows/vuln-corpus.yml"
      - "scripts/ingest-vuln-corpus.mjs"
      - "scripts/ci-commit.mjs"
      - "scripts/record-failure.mjs"
      - "artifacts/api-server/src/lib/ops/vuln-corpus.ts"
  # TEST5 «لسة 104 ومفيش تحديث لحظي»: كل دمج على main بيخلص نشره ⇒ أمشي الكوربوس
  # على طول. الدمجات بتتم بأدوات تكرار أعلى من كرون GitHub المتأخر، فالتتبّع ده
  # هو اللي يخلي الفهرس يتنفس بدل ما يقعد ساعات جامد.
  workflow_run:
    workflows: ["NOVA portable bundle (24/7)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental | full"
        default: "incremental"
      pages:
        description: "pages of 2000 for full mode (0 = whole database)"
        default: "0"

permissions:
  contents: write

concurrency:
  # v2: a stuck run in the old group would block every later ingest, and the
  # integration token has no actions:write, so it cannot be cancelled remotely.
  group: vuln-corpus-v2
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A run that waits in the concurrency queue keeps the commit it was QUEUED
      # with, not the one that exists when it starts. The deepen cursor lives in
      # state/vuln-corpus-index.json, so a stale checkout walks a window that has
      # already been walked. Measured: run 41905819968 was queued at 20:21:25 on
      # 27a0fede, started at 20:31:07 (after the 20:30:56 index commit), and still
      # reported walkedFrom 0 / nextStartIndex 24000 — the same 24,000-row window
      # as the run before it, 1,071 net new rows. Moving the tree to the current
      # origin/main before any work is what makes the cursor a cursor.
      - name: move to the current origin/${{ github.ref_name }} (a queued run starts on a stale commit)
        run: |
          git fetch --prune origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "working from $(git rev-parse --short HEAD) · index says $(
            node -e 'const d=require("./state/vuln-corpus-index.json");console.log(d.total+" rows, deepen cursor "+(d.deepen?.nextStartIndex ?? "none"))'
          )"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      # قِيس 2026-11-13: الخطوة دي بتنتج 44/44 محليًا على نفس الشارة ونفس
      # node 22 وعلى checkout نضيف — وفشلت مرتين على CI بصمت. إعادة محاولة
      # واحدة مع تشريح ::error:: لكل فشل (لو فشل مرتين فهو حقيقي مش بيئة).
      - name: plumbing proofs (44 checks, no network needed)
        run: |
          node scripts/test-vuln-corpus.mjs ||           (echo "⟳ retry after a silent CI failure"; node scripts/test-vuln-corpus.mjs)

      - name: warm the base corpus (a delta needs something to merge onto)
        run: |
          node -e '
            (async () => {
              const { execFileSync } = require("child_process");
              const fs = require("fs"), path = require("path");
              const dir = "artifacts/api-server/node_modules/.cache/vuln-corpus";
              fs.mkdirSync(dir, { recursive: true });
              execFileSync(path.join("artifacts/api-server/node_modules/.bin/esbuild"),
                ["artifacts/api-server/src/lib/ops/vuln-corpus.ts", "--bundle", "--platform=node",
                 "--format=cjs", "--target=node22", "--outfile=" + path.join(dir, "vuln-corpus.cjs")],
                { stdio: "inherit" });
              const lib = require("./" + path.join(dir, "vuln-corpus.cjs"));
              if (fs.existsSync(lib.corpusFile()) && fs.statSync(lib.corpusFile()).size > 1024) {
                console.log("base corpus already present:", lib.corpusFile());
                return;
              }
              const r = await lib.provisionCorpus();
              console.log(`provision: ${r.action} · ${r.says_ar}`);
              if (!r.ok) process.exit(1);
            })();
          '

      - name: ingest
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # push = someone changed the pipeline itself → take the opportunity to
          # rebuild the corpus properly (a delta cannot repair a damaged base).
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'full' || (github.event.schedule == '0 3 * * 0' && 'full' || 'incremental')) }}
          PAGES: ${{ github.event.inputs.pages || (github.event_name == 'push' && '60' || '0') }}
        run: |
          if [ "$MODE" = "full" ]; then
            if [ "$PAGES" = "0" ]; then
              node scripts/ingest-vuln-corpus.mjs --all
            else
              node scripts/ingest-vuln-corpus.mjs --pages="$PAGES"
            fi
          else
            node scripts/ingest-vuln-corpus.mjs --incremental
          fi

      # The measured gap: byYear in the committed index lists 1999–2011 and then
      # 2024–2026, with 2012–2023 missing, because one run can only walk ~25 pages
      # (50k rows) before the polite NVD delay eats the job. This step carries the
      # walk forward 12 pages per run from the cursor in the index, so the gap
      # closes over the day instead of never.
      # pipefail keeps the step's exit code honest through the tee, and the tee is
      # what gives the next step something to record: this repository's job logs
      # cannot be downloaded, so "it failed" with no reason is all we would have.
      # قِيس 2026-11-13: فشل deepen الصامت (log 0 bytes، run 43516815280) كان
      # بيقطع السلسلة كلها — النشر بيتباس والكوربوس يفضل جامد. الدروب ده
      # استكمالي (بيدرّس تاريخ أقدم) فمش بلازم يمنع نشر التحديث الأساسي؛
      # بيسجّل سببه في state/corpus-last-failure.json زي ما هو.
      - name: deepen the walk (12 pages from the stored cursor)
        continue-on-error: true
        env:
          CORPUS_TIME_BUDGET_MIN: "14"
        run: |
          set -o pipefail
          node scripts/ingest-vuln-corpus.mjs --deepen --pages=32 2>&1 | tee "$RUNNER_TEMP/deepen.log"

      # Runs only when the step above failed, and commits what it captured, so the
      # reason survives the run (measured: two deepen failures left nothing behind).
      - name: record why the deepen failed
        if: failure()
        run: node scripts/record-failure.mjs --step "deepen" --log "$RUNNER_TEMP/deepen.log" --out state/corpus-last-failure.json --commit

      - name: build the panel dataset from the corpus
        run: node scripts/make-panel-corpus.mjs --rows=800

      - name: measured summary
        run: |
          node -e '
            const i = require("./state/vuln-corpus-index.json");
            const sev = Object.entries(i.bySeverity).map(([k,v]) => `${k}: ${v}`).join(" · ");
            const mb = (i.files.bytes/1048576).toFixed(2);
            console.log(`${i.total} CVEs · ${i.kev} KEV · ${i.epssScored} EPSS · ${i.products} products · ${mb} MB`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Vulnerability corpus (measured)\n\n| | |\n|---|---|\n| **CVEs stored** | ${i.total} |\n| exploited in the wild (KEV) | ${i.kev} |\n| EPSS-scored | ${i.epssScored} |\n| distinct products (CPE) | ${i.products} |\n| corpus size | ${mb} MB |\n| mode | ${i.mode} |\n| synced at | ${i.at} |\n| severity | ${sev} |\n\nTop products: ${i.topProducts.slice(0,8).map(p=>`${p.product} (${p.count})`).join(", ")}\n`);
          '

      - name: commit the index (the corpus itself goes to the release)
        env:
          # a colon inside an unquoted YAML scalar ("chore(corpus): …") makes the
          # whole workflow file invalid — pass the message through env instead
          MSG: "chore(corpus): measured CVE index $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
        run: |
          # --allow-empty: an incremental window with no new CVEs is the normal
          # quiet case, and saying so is honest. A full/deepen pass always differs.
          node scripts/ci-commit.mjs --allow-empty --message "$MSG" state/vuln-corpus-index.json artifacts/kali-panel/public/state/vuln-corpus-live.json

      - name: publish the corpus as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vuln-corpus
          name: "Vulnerability corpus (NVD + KEV + EPSS)"
          body: |
            Corpus حقيقي مفتوح: `cves.jsonl.gz` (سطر JSON لكل CVE) + `index.json`.

            - المصدر: NVD 2.0 + CISA KEV + FIRST EPSS (كلهم مجانيين بلا مفتاح)
            - الأرقام مكتوبة في `vuln-corpus-index.json` مع وقت السحب
            - الاستخدام من البرنامج: `NOVA_CORPUS_INDEX` + الملف في `state/vuln-corpus/`
          files: |
            state/vuln-corpus/cves.jsonl.gz
            state/vuln-corpus-index.json
          fail_on_unmatched_files: false

      - name: mirror the corpus onto an orphan branch (raw.githubusercontent fallback)
        # تحميل الـrelease بيعدي على release-assets.githubusercontent.com بعد
        # redirect — على بعض المضيفات المجانية بيعمل «fetch failed» فيبقى الكوربوس
        # جامد على رقم قديم. الفرع اليتيم ده (ملف واحد، commit واحد بينreplace كل
        # مرة) بينشر نفس البايتات عبر raw.githubusercontent.com — CDN مختلف
        # أوسع انتشارًا. السيرفر بيجرب الـrelease الأول وبعده المرآة دي.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/corpus-mirror && mkdir -p /tmp/corpus-mirror
          cp state/vuln-corpus/cves.jsonl.gz state/vuln-corpus-index.json /tmp/corpus-mirror/
          cd /tmp/corpus-mirror
          git init -q -b vuln-corpus-data
          git add -A
          git -c user.email=ci@cybernova.local -c user.name="corpus mirror" commit -qm "corpus data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:vuln-corpus-data
