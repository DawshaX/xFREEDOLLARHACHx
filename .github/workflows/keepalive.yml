# ─────────────────────────────────────────────────────────────────────────────
# Keeps a free-tier deployment awake and backs up NOVA's long-term memory.
#
# Why: Render/Koyeb free instances sleep after ~15 minutes. A 10-minute ping
# keeps the agent warm so it answers instantly — and costs nothing.
#
# Setup (GitHub → Settings → Secrets and variables → Actions → New secret):
#   NOVA_URL   e.g. https://cybernova-nova.onrender.com   (no trailing slash)
#
# Optional: MEMORY_TOKEN — if you protect the memory endpoint later.
# ─────────────────────────────────────────────────────────────────────────────
name: NOVA keep-alive & memory backup

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — keep the free instance awake
    - cron: "20 3 * * *"     # daily — snapshot the long-term memory
  workflow_dispatch:

concurrency:
  group: nova-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: wake the agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # للخطوة اللي بتطلب live-verify لما القياس يعجّز
    steps:
      - name: Ping /api/health
        env:
          NOVA_URL: ${{ secrets.NOVA_URL || vars.NOVA_HUB_URL }}
        run: |
          if [ -z "${NOVA_URL:-}" ]; then
            echo "::notice::مفيش NOVA_URL (سرّ) ولا NOVA_HUB_URL (متغيّر) — القفز. حط رابط الـservice في أي واحدة منهم."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$NOVA_URL/api/health" || echo 000)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::agent did not answer after 3 tries"

      - name: Ping the agent brain
        env:
          NOVA_URL: ${{ secrets.NOVA_URL || vars.NOVA_HUB_URL }}
        run: |
          if [ -z "${NOVA_URL:-}" ]; then exit 0; fi
          curl -s --max-time 30 "$NOVA_URL/api/nova-core/status" | head -c 400 || true

      - name: Keep the self-measurement loop honest
        # الحلقة اللي بتقيس الأدوات (`live-verify`) جدولها `40 */6`، وGitHub أدّى خانة 00:40
        # متأخرة 31 دقيقة وحذف خانة 06:40 خالص — فالتقرير فضل **12 ساعة** قديم (مقاس 2026-11-03،
        # آخر نشر 01:18Z). الكرون هنا `*/10` وهو الوحيد اللي بيمرّ فعلًا، فبدل ما نثق في جدول
        # «تقريبي»: لو القياس اتأخر أكتر من 9 ساعات، نطلبه بـdispatch. الحلقة بتفكّر نفسها.
        # الفشل هنا ::warning:: مش ::error:: — لأن الجدول الأساسي لسه شغال وده مسار احتياطي.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          raw=$(gh api "repos/$repo/contents/state/verified-live.md" --jq .content 2>/dev/null || echo "")
          if [ -z "$raw" ]; then
            echo "::warning::مافيش state/verified-live.md على main — ماقدرناش نعرف عمر القياس"
            exit 0
          fi
          line=$(printf '%s' "$raw" | base64 -d | grep -m1 -oE '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9](:[0-9][0-9])?(\.[0-9]+)?Z')
          if [ -z "$line" ]; then
            echo "::warning::التقرير موجود بس مافيش فيه طابع زمني مفهوم — الحارس ما يقدرش يحكم"
            exit 0
          fi
          then=$(date -u -d "$line" +%s 2>/dev/null || echo 0)
          now=$(date -u +%s)
          age_h=$(( (now - then) / 3600 ))
          echo "آخر قياس منشور: $line · العمر ${age_h}h"
          if [ "$age_h" -ge 9 ]; then
            # الحارس بيشتغل كل 10 دقايق، والقياس نفسه بياخد ~15 دقيقة — من غير الفحص ده كل دورة
            # هترمي موجة جديدة والطابور يتعمّر بشغلات مكرّرة (وكلها راينرات مدفوعة بالحد المجاني).
            already=$(gh api "repos/$repo/actions/runs?status=in_progress&per_page=30" --jq '[.workflow_runs[] | select(.name | startswith("live verify"))] | length' 2>/dev/null || echo 0)
            queued=$(gh api "repos/$repo/actions/runs?status=queued&per_page=30" --jq '[.workflow_runs[] | select(.name | startswith("live verify"))] | length' 2>/dev/null || echo 0)
            if [ "${already:-0}" != "0" ] || [ "${queued:-0}" != "0" ]; then
              echo "قياس شغال أصلًا (in_progress=${already:-0} · queued=${queued:-0}) — مفيش داعي لموجة تانية"
              exit 0
            fi
            echo "القياس اتأخر 9 ساعات+ — بطلب live-verify دلوقتي"
            if gh api -X POST "repos/$repo/actions/workflows/live-verify.yml/dispatches" -f ref="$GITHUB_REF_NAME" 2>/tmp/d.err; then
              echo "✓ اتبعت الطلب (${age_h}h stale)"
            else
              echo "::warning::dispatch اترفض: $(head -c 160 /tmp/d.err | tr '\n' ' ') — محتاج actions:write على الـtoken، أو الجدول هيكفي"
            fi
          else
            echo "القياس طازة (${age_h}h) — مفيش حاجة تتعمل"
          fi

  backup:
    name: daily memory backup
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download memory snapshot
        env:
          NOVA_URL: ${{ secrets.NOVA_URL || vars.NOVA_HUB_URL }}
        run: |
          if [ -z "${NOVA_URL:-}" ]; then
            echo "::notice::NOVA_URL secret is not set — skipping backup."
            exit 0
          fi
          mkdir -p backup
          code=$(curl -s -o backup/nova-memory.json -w "%{http_code}" --max-time 60 "$NOVA_URL/api/nova-core/memory/export" || echo 000)
          echo "HTTP $code · $(wc -c < backup/nova-memory.json) bytes"
          # keep only today's run (the artifact store holds the history)
          jq -e '.records | length' backup/nova-memory.json >/dev/null 2>&1 \
            && echo "records: $(jq '.records | length' backup/nova-memory.json)" \
            || echo "::warning::memory export did not look like a valid snapshot"

      - uses: actions/upload-artifact@v4
        with:
          name: nova-memory-${{ github.run_number }}
          path: backup/
          retention-days: 30
          if-no-files-found: ignore
