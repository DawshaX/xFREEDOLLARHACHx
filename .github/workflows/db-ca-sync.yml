name: DB CA pin sync

# ─────────────────────────────────────────────────────────────────────────────
# يقرأ سلسلة TLS الحية من DATABASE_URL (Neon) ويثبّت شهادة الجذر جوه الحزمة —
# فوضع SSL strict يشتغل على أي مضيف بلا أي إعداد يدوي ولا لصق PEM في واجهات
# بتسحق الأسطر (الكسر المقاس 2026-11-09: SELF_SIGNED_CERT_IN_CHAIN شلّ
# الـbrainstore كله طول ما العقدة صاحية). الشهادة بيانات عامة: هي اللي بيتسلمها
# أي عميل TLS عند الوصلاء — السر (DATABASE_URL) بيفضل في Secrets.
#
# بيشتغل: يوميًا + لما الملف ده أو السكربت يتلمس على main + يدوي.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "17 3 * * *" # يومي — Neon بيلف السلسلة ببطء، والتحديث الذاتي بيلتقط
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/fetch-db-ca.mjs"
      - ".github/workflows/db-ca-sync.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: db-ca-sync
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the live TLS chain and regenerate the pinned CA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          {
            echo "host hint: $(node -e "const u=new URL(process.env.DATABASE_URL||''); console.log(u.hostname+':'+(u.port||5432))" 2>&1)"
            node scripts/fetch-db-ca.mjs --write ops/db-ca/live-root.pem --emit-ts lib/db/src/db-bundled-ca.ts
            grep -q "BEGIN CERTIFICATE" ops/db-ca/live-root.pem
            grep -q "BEGIN CERTIFICATE" lib/db/src/db-bundled-ca.ts
            echo "subject: $(openssl x509 -in ops/db-ca/live-root.pem -noout -subject 2>/dev/null || echo n/a)"
          } 2>&1 | tee /tmp/pin.log

      # سجلات Actions مش متقروءة من الرملة الحرة (egress محصور) — فالفشل بيفتح
      # issue بنص الخطأ كامل بدل ما يفضل أصم، والنجاح بيقفل أي issue قديم مفتوح تلقائيًا.
      - name: Self-report failure as an issue (deduped)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="db-ca-sync: تعذّر قراءة/تثبيت شهادة Neon"
          LOG="$(tail -c 3000 /tmp/pin.log 2>/dev/null || echo 'no log captured')"
          {
            echo "تشغيل ${{ github.run_id }} فشل — آخر اللوج:"
            echo '```'
            echo "$LOG"
            echo '```'
          } > /tmp/issue-body.md
          existing=$(gh api "repos/$REPO/issues?state=open&per_page=50" \
            --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X POST "repos/$REPO/issues/$existing/comments" -F body=@/tmp/issue-body.md >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md || true
          fi

      - name: Auto-close stale db-ca-sync failure issues on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="db-ca-sync: تعذّر قراءة/تثبيت شهادة Neon"
          ids=$(gh api "repos/$REPO/issues?state=open&per_page=50" \
            --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null || true)
          for id in $ids; do
            gh api -X POST "repos/$REPO/issues/$id/comments" \
              -f body="✅ تم قراءة وتثبيت شهادة TLS بنجاح في التشغيل ${{ github.run_id }} ($(date -u +%FT%TZ)). تم الإغلاق تلقائيًا." >/dev/null 2>&1 || true
            gh api -X PATCH "repos/$REPO/issues/$id" -f state=closed >/dev/null 2>&1 || true
          done

      - name: Commit if the pin actually rotated
        id: pin
        run: |
          set -e
          git config user.name "nova-bot[ci]"
          git config user.email "bot@users.noreply.github.com"
          git add ops/db-ca/live-root.pem lib/db/src/db-bundled-ca.ts
          # next-hop: standalone-bundle بيشتغل علينا بـworkflow_run (مقاس:
          # gh dispatch بـGITHUB_TOKEN = 403 Resource not accessible).
          if git diff --cached --quiet; then
            echo "pin unchanged — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(db): rotated pinned Neon CA from the live TLS chain [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


