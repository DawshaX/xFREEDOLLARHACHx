# TEST63b — تشخيص كامل لأول أداة (ffuf): الرد الكامل كannotations — عشان
# نشوف خطأ dpkg error (2) جوه الجست بالحرف ونفكس الجذر.
name: kali tools install (debug full output)
on:
  push:
    paths:
      - ".github/workflows/kali-tools-install.yml"
permissions:
  contents: read
concurrency:
  group: kali-tools-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - name: install ffuf once and print the FULL response as annotations
        run: |
          R=$(curl -s --max-time 450 -X POST "$HUB/api/kali-env/install" \
            -H "x-nova-token: $TOKEN" -H "content-type: application/json" \
            -d '{"tool":"ffuf"}')
          echo "$R" | head -c 1500 > resp.txt
          # قسّم الرد chunks 700 حرف — كل chunk annotation (الحد ~1000)
          split -b 700 resp.txt chunk_
          for C in chunk_*; do
            MSG=$(cat "$C" | tr -d '\n\r' )
            echo "::warning::$MSG"
          done
