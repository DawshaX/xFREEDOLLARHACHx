# TEST74 — أمر المالك (2026-11-18): «حمل كل الادوات الناقصة» — الهدف 248/248 مقاس.
# البيانات كلها عالجيت هوب: القياس والتنزيل والتثبيت كلها عبر API الهَب من runner
# (curl من runner لنوفا مقاس شغال — العكس من السانبوكس المقطوع).
# الميكانيكا: GET tools → الناقص من كل الفئات → POST install لكل أداة (الهَب
# بيسلسلها بنفسه install.running) → remedy dpkg لو لزم → إعادة قياس → تقرير.
name: kali tools fill (install every missing tool → 248/248)
on:
  push:
    paths:
      - ".github/workflows/hub-tools-fill.yml"
permissions:
  contents: write
concurrency:
  group: hub-tools-fill
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - uses: actions/checkout@v4
      - name: القياس الحالي + استخراج الناقص (بمحاولتين — الرد كله في اللوج)
        run: |
          L=state/tools-fill-log.txt
          echo "=== fill started $(date -u +%FT%TZ) ===" > $L
          curl -s -m 400 -H "Authorization: Bearer $TOKEN" "$HUB/api/kali-env/tools" -o /tmp/tools-before.json || true
          echo "try1-bytes=$(wc -c < /tmp/tools-before.json 2>/dev/null || echo 0)" >> $L
          if ! python3 -c 'import json,sys; json.load(open("/tmp/tools-before.json")); print("json ok")' 2>/dev/null; then
            echo "الرد مش JSON — محاولة تانية fresh" >> $L
            sleep 15
            curl -s -m 400 -H "Authorization: Bearer $TOKEN" "$HUB/api/kali-env/tools?fresh=$RANDOM" -o /tmp/tools-before.json || true
            echo "try2-bytes=$(wc -c < /tmp/tools-before.json 2>/dev/null || echo 0)" >> $L
          fi
          head -c 300 /tmp/tools-before.json >> $L 2>/dev/null; echo >> $L
          (python3 - <<'PY' || true
          import json
          d = json.load(open("/tmp/tools-before.json"))
          missing = set()
          for grp in (d.get("groups") or {}).values():
              missing.update(grp.get("missing") or [])
          open("/tmp/missing.txt", "w").write("\n".join(sorted(missing)))
          print("قبل: present=%s/%s · الناقص=%d" % (d.get("present"), d.get("total"), len(missing)))
          PY
          ) 2>&1 | tee -a $L || true
          wc -l /tmp/missing.txt >> $L 2>/dev/null; cat /tmp/missing.txt >> $L 2>/dev/null || true
          true
      - name: كوميت اللوج الجزئي (دايمًا — مستحيل تفشل)
        run: |
          git config user.name "nova-bot" 2>/dev/null || true; git config user.email "nova@bot.local" 2>/dev/null || true
          git add state/tools-fill-log.txt 2>/dev/null || true
          git commit -m "state: tools-fill log (partial)" 2>/dev/null || true
          git pull --rebase origin arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          git push origin HEAD:arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          exit 0
      - name: تثبيت كل أداة ناقصة (مسلسل — الهَب بيسلسل بنفسه)
        run: |
          L=state/tools-fill-log.txt
          touch /tmp/failures.txt
          total=$(wc -l < /tmp/missing.txt); i=0; okc=0; failc=0
          while IFS= read -r tool; do
            [ -z "$tool" ] && continue
            i=$((i+1))
            R=$(curl -s -m 470 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" || echo '{}')
            verdict=$(echo "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("OK" if d.get("ok") else "FAIL·"+str(d.get("error",""))[:120])' 2>/dev/null || echo "BAD·parse")
            echo "[$i/$total] $tool → $verdict"
            echo "[$i/$total] $tool → $verdict" >> $L
            echo "$R" | head -c 260 >> $L; echo >> $L
            case "$verdict" in OK*) okc=$((okc+1));; *) failc=$((failc+1)); echo "$tool" >> /tmp/failures.txt;; esac
          done < /tmp/missing.txt
          echo "pass1: ok=$okc fail=$failc" | tee /tmp/pass1.txt | tee -a $L
      - name: remedy dpkg + إعادة محاولة الفاشل (مرة)
        run: |
          L=state/tools-fill-log.txt
          [ -s /tmp/failures.txt ] || { echo "مافيش فاشل — skip"; exit 0; }
          curl -s -m 120 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"command":"dpkg --configure -a 2>&1 | tail -3; echo REMEDY_DONE","timeoutMs":90000}' "$HUB/api/kali-env/exec" | tail -2 || true
          okc=0; failc=0
          while IFS= read -r tool; do
            [ -z "$tool" ] && continue
            R=$(curl -s -m 470 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" || echo '{}')
            verdict=$(echo "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("OK" if d.get("ok") else "FAIL·"+str(d.get("error",""))[:120])' 2>/dev/null || echo "BAD·parse")
            echo "[retry] $tool → $verdict"
            case "$verdict" in OK*) okc=$((okc+1));; *) failc=$((failc+1)); echo "$tool" >> /tmp/still.txt;; esac
          done < /tmp/failures.txt
          echo "retry: ok=$okc fail=$failc" | tee -a $L
          if [ -s /tmp/still.txt ]; then echo "::notice::لسه ناقص بعد retry: $(tr '\n' ' ' < /tmp/still.txt)"; fi
          git config user.name "nova-bot" 2>/dev/null; git config user.email "nova@bot.local" 2>/dev/null
          git add state/tools-fill-log.txt 2>/dev/null
          git commit -m "state: tools-fill partial log" 2>/dev/null || true
          git pull --rebase origin arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          git push origin HEAD:arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          exit 0
      - name: القياس النهائي + التقرير (مستحيل تفشل — كل حاجة مسجلة)
        run: |
          L=state/tools-fill-log.txt
          (
          set +e
          sleep 10
          curl -s -m 280 -H "Authorization: Bearer $TOKEN" "$HUB/api/kali-env/tools" -o /tmp/tools-after.json
          true
          echo "after-bytes=$(wc -c < /tmp/tools-after.json)" >> $L
          head -c 200 /tmp/tools-after.json >> $L; echo >> $L
          (python3 - <<'PY' || true
          import json, datetime
          d = json.load(open("/tmp/tools-after.json"))
          b = json.load(open("/tmp/tools-before.json"))
          missing = set()
          for grp in (d.get("groups") or {}).values():
              missing.update(grp.get("missing") or [])
          report = {
            "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "before": {"present": b.get("present"), "total": b.get("total")},
            "after": {"present": d.get("present"), "total": d.get("total"), "measuredOn": str(d.get("measuredOn"))[:80]},
            "stillMissing": sorted(missing),
          }
          open("state/tools-fill-report.json", "w").write(json.dumps(report, ensure_ascii=False, indent=2))
          print("بعد: present=%s/%s · measuredOn=%s" % (d.get("present"), d.get("total"), d.get("measuredOn")))
          print("لسه ناقص: %d → %s" % (len(missing), sorted(missing)[:40]))
          PY
          ) 2>&1 | tee -a $L || true
          echo "python-exit=$?" >> $L
          echo "=== fill ended $(date -u +%FT%TZ) ===" >> $L
          true
          ) 2>&1 | tee -a $L || true
          echo "step-exit=$?" >> $L
          git config user.name "nova-bot" 2>/dev/null; git config user.email "nova@bot.local" 2>/dev/null
          git add state/tools-fill-report.json state/tools-fill-log.txt 2>/dev/null
          git commit -m "state: tools-fill report + log" 2>/dev/null || true
          git pull --rebase origin arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          git push origin HEAD:arena/f288ad41-xfreedollarhachx 2>/dev/null || true
          exit 0
      - name: الخلاصة (gate الأدوات)
        run: |
          python3 - <<'PY' || true
          import json
          d = json.load(open("/tmp/tools-after.json"))
          p, t = d.get("present"), d.get("total")
          print("الأدوات النهائية: %s/%s" % (p, t))
          if p == t:
              print("::notice::كل الأدوات مثبتة 100% ✓")
          else:
              print("::warning::ناقص %s أداة — إعادة تشغيل الworkflow بتمر تانية" % (t-p))
          PY
          true
