# TEST80g — الهجوم المينيمالي المضمون: مافيش دوال ولا python — curl خام بأوامر
# بدائية جدًا (dpkg --configure -a وحده — ما اتنفذش ولا مرة مقاس) + continue-on-error
# على كل خطوة عشان الكل يتنفذ محكم.
name: "kali root attack v3 (TEST88 hub — pip+clone+binaries: 23 أداة مستقلة عن dpkg)"
on:
  push:
    paths:
      - ".github/workflows/kali-root-attack-v3.yml"
permissions:
  contents: write
concurrency:
  group: kali-root-attack-v3
  cancel-in-progress: false
jobs:
  attack3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - uses: actions/checkout@v4
      - name: dpkg --configure -a (وحده تمامًا — 3 محاولات)
        continue-on-error: true
        run: |
          L=state/root-attack-log.txt
          echo "=== V3 $(date -u +%FT%TZ) ===" > $L
          for i in 1 2 3; do
            curl -s -m 300 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d '{"command":"dpkg --configure -a 2>&1 | tail -5; echo CONFIG_EXIT_$?","timeoutMs":240000}' "$HUB/api/kali-env/exec" >> $L 2>&1 || echo "REQ_FAIL_$i" >> $L
            echo "" >> $L
            sleep 3
          done
          true
      - name: apt-get -f install + audit + update
        continue-on-error: true
        run: |
          L=state/root-attack-log.txt
          curl -s -m 300 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d '{"command":"DEBIAN_FRONTEND=noninteractive apt-get -f install -y -qq 2>&1 | tail -3; echo FIX_$?","timeoutMs":240000}' "$HUB/api/kali-env/exec" >> $L 2>&1 || true
          echo "" >> $L
          curl -s -m 200 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d '{"command":"dpkg --audit 2>&1 | head -4; echo AUDIT_END","timeoutMs":120000}' "$HUB/api/kali-env/exec" >> $L 2>&1 || true
          echo "" >> $L
          curl -s -m 300 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d '{"command":"DEBIAN_FRONTEND=noninteractive apt-get update -qq 2>&1 | tail -2; echo UPD_$?","timeoutMs":240000}' "$HUB/api/kali-env/exec" >> $L 2>&1 || true
          echo "" >> $L
          true
      - name: تثبيت amass وحده أولًا (الاختبار الفاصل)
        continue-on-error: true
        run: |
          L=state/root-attack-log.txt
          curl -s -m 470 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d '{"tool":"amass"}' "$HUB/api/kali-env/install" >> $L 2>&1 || echo REQ_FAIL >> $L
          echo "" >> $L
          true
      - name: باقي الأدوات الحرجة (مسلسل)
        continue-on-error: true
        run: |
          L=state/root-attack-log.txt
          for tool in subfinder naabu dnsx httpx katana cariddi dockle grype syft trufflehog bettercap asnmap shuffledns chisel ligolo-ng mongosh maigret h8mail prowler scoutsuite pacu certipy bloodhound-python ssh-audit semgrep sublist3r volatility osintgram netexec routersploit photon; do
            curl -s -m 470 -X POST -H "x-nova-token: $TOKEN" -H "Content-Type: application/json" -d "{\"tool\":\"$tool\"}" "$HUB/api/kali-env/install" >> $L 2>/dev/null || echo "REQ_FAIL:$tool" >> $L
            echo "" >> $L
          done
          echo "=== INSTALLS DONE $(date -u +%FT%TZ) ===" >> $L
          true
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot" || true
          git config user.email "nova@bot.local" || true
          git add -f state/root-attack-log.txt || true
          git commit -m "state: root-attack v3 log" || true
          git pull --no-rebase --no-edit origin arena/82d00f13-xfreedollarhachx || true
          git push origin HEAD:arena/82d00f13-xfreedollarhachx || true
          exit 0
      - name: القياس النهائي
        continue-on-error: true
        run: |
          L=state/root-attack-log.txt
          sleep 8
          curl -s -m 280 -H "x-nova-token: $TOKEN" "$HUB/api/kali-env/tools?fresh=$RANDOM" -o /tmp/tools-after.json || true
          jq '{present, total, measuredOn, stillMissing: ([.groups[].missing] | add)}' /tmp/tools-after.json > state/root-attack-report.json 2>/dev/null || cp /tmp/tools-after.json state/root-attack-report.json
          echo "=== القياس النهائي ===" >> $L
          cat state/root-attack-report.json >> $L 2>/dev/null || true
          git config user.name "nova-bot" || true
          git config user.email "nova@bot.local" || true
          git add -f state/root-attack-report.json state/root-attack-log.txt || true
          git commit -m "state: root-attack v3 report" || true
          git pull --no-rebase --no-edit origin arena/82d00f13-xfreedollarhachx || true
          git push origin HEAD:arena/82d00f13-xfreedollarhachx || true
          exit 0
