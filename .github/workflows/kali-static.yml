# proot-static — المسار السريع: نزّل النسخة الستاتيكية (شغالة على أي glibc)
# وارفعها لفرع kali-static عشان السانبوكس يجيبها بgit fetch (الasset نفسه
# محجوب عنده لأن التحميل بيبقى من objects.githubusercontent).
name: Kali static proot (fast lane)
on:
  workflow_dispatch:
  # dispatch للتوكن بتاعي ممنوع (403 integration) ⇒ لمس الملف نفسه بيشغّله
  push:
    branches: [main]
    paths: [".github/workflows/kali-static.yml"]

permissions:
  contents: write

jobs:
  push-static:
    runs-on: ubuntu-latest
    steps:
      - name: نزّل proot-static وتحقق وارفع الفرع kali-static
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # القياس الحي: nohajc/proot-static أصلًا مش موجود (404) — المرشحات الحقيقية:
          # ysdragon/proot-static v5.4.0 (proot-x86_64-static) ثم proot-me الرسمي v5.1.1.
          URL=""
          for CAND in "https://github.com/ysdragon/proot-static/releases/latest/download/proot-x86_64-static"; do
            if curl -fsSL "$CAND" -o "$RUNNER_TEMP/proot-static" 2>/dev/null; then URL="$CAND"; break; fi
          done
          if [ -z "$URL" ]; then
            URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/proot-me/proot-static-build/releases 2>/dev/null | grep browser_download_url | grep 'proot_5' | grep x86_64 | grep -v 'no-seccomp\|care' | head -1 | cut -d'"' -f4)
            [ -n "$URL" ] && curl -fsSL "$URL" -o "$RUNNER_TEMP/proot-static" || true
          fi
          echo "::notice::asset=$URL"
          [ -s "$RUNNER_TEMP/proot-static" ] || { echo "::error::مافيش binary static اتنزل"; exit 1; }
          chmod +x "$RUNNER_TEMP/proot-static"
          "$RUNNER_TEMP/proot-static" --version || { echo "::error::الbinary مش شغال — مش static فعلًا"; exit 1; }
          mkdir -p /tmp/br && cd /tmp/br
          git init -q -b kali-static
          cp "$RUNNER_TEMP/proot-static" .
          cp "$RUNNER_TEMP/proot-static" usr-local-bin-proot-static-copy 2>/dev/null || true
          rm -f usr-local-bin-proot-static-copy
          git config user.name "nova-builder"
          git config user.email "nova@ci.local"
          git add -A
          git commit -qm "proot-static — $URL"
          git -c http.version=HTTP/1.1 push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kali-static
          echo "✔ فرع kali-static اترفع — مقاس من نجاح الpush و--version فوق"
