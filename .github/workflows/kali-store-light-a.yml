# TEST93k — light-a: نص الحزم الخفيفة الأول (v8 اتلغت تالت مرة بالسقف —
# الدرس المقاس: 26 حزمة مسلسل لا تتسع 45د؛ النصين متوازيان ≈20د للنصف).
name: "kali store light-a v9 (12 حزمة → tarballs → release kali-store)"
on:
  push:
    paths:
      - ".github/workflows/kali-store-light-a.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kali-store-light-a
  cancel-in-progress: false
jobs:
  light-a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: tarballs (حزمة-حزمة)
        run: |
          mkdir -p store state
          docker run --rm -v "$PWD/store:/store" -w /store kalilinux/kali-rolling:latest bash -c '
            export DEBIAN_FRONTEND=noninteractive
            echo "=== light-a $(date -u +%FT%TZ) ===" | tee /store/build-light-a.log
            apt-get update 2>&1 | tail -2 | tee -a /store/build-light-a.log || true
            PKGS="ettercap exiftool libimage-exiftool-perl steghide arp-scan cherrytree casefile recordmydesktop wkhtmltopdf evilgrade maskprocessor rainbowcrack"
            apt-get install -y --no-install-recommends curl ca-certificates git unzip >/dev/null 2>&1 || true
            for p in $PKGS; do
              if apt-get install -y --no-install-recommends $p >> /store/apt-a.log 2>&1; then
                dpkg -L $p | grep -v -E "^/etc/|/usr/share/doc/|/usr/share/man/" > /tmp/fl.txt
                tar czf /store/$p.tar.gz -T /tmp/fl.txt 2>/dev/null || true
                echo "OK:$p $(stat -c%s /store/$p.tar.gz 2>/dev/null || echo 0)" | tee -a /store/build-light-a.log
              else
                echo "MISS:$p" | tee -a /store/build-light-a.log
              fi
            done
            echo "LIGHT_A_DONE" | tee -a /store/build-light-a.log
            true
          ' || echo "docker-exit:$?" | tee -a state/kali-store-light-a.log
          cp store/build-light-a.log state/kali-store-light-a.log 2>/dev/null || true
      - name: رفع الأصول
        continue-on-error: true
        run: |
          shopt -s nullglob
          ASSETS=(store/*.tar.gz)
          echo "light-a tarballs: ${#ASSETS[@]}"
          gh release view kali-store -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create kali-store -R "$GITHUB_REPOSITORY" --title "kali-store — tarballs بدون dpkg" --notes "TEST93k"
          [ ${#ASSETS[@]} -gt 0 ] && gh release upload kali-store "${ASSETS[@]}" store/build-light-a.log --clobber -R "$GITHUB_REPOSITORY" && echo "::notice::✓ light-a: ${#ASSETS[@]}"
          exit 0
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot"; git config user.email "nova@bot.local"
          git add -f state/kali-store-light-a.log; git commit -m "state: light-a log [skip ci]" || true
          git pull --no-rebase --no-edit origin arena/1aad5cfd-xfreedollarhachx; git push origin HEAD:arena/1aad5cfd-xfreedollarhachx; exit 0
