name: backend health (the edge function, measured from outside)

# The panel claims a live backend. This proves it every 30 minutes and records
# the response times + row counts the claim is based on.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/backend-check.mjs"
      - "supabase/functions/**"

permissions:
  contents: write

concurrency:
  group: backend-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # GitHub keeps the commit a run was QUEUED with; a run that waits behind
      # concurrency: starts on state that is already old, decides its next step
      # from it, and then writes that stale state back over the newer one.
      # Measured: run 41905819968 queued 20:21:25 on 27a0fede, started 20:31:07
      # after the 20:30:56 index commit, and re-ran the same work (walkedFrom 0).
      - name: move to the current origin/${{ github.ref_name }} (a queued run starts on a stale commit)
        run: |
          git fetch --prune origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          git log -1 --format='now on %h · %s'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: measure the backend
        run: node scripts/backend-check.mjs
      - name: publish the measurement
        if: always()
        env:
          MSG: "chore(backend): health probe [skip ci]"
        run: |
          node scripts/ci-commit.mjs --message "$MSG" state/backend-health.json state/organs.csv state/hunt-findings.csv state/hunt-runs.csv
