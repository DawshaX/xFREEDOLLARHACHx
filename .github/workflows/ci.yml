name: Safe platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Migration and secret-pattern check
        run: node scripts/check-migration.mjs
      - name: Safe control-plane tests
        run: node --test platform/tests
