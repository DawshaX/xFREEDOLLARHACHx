name: probe-live-llm

# Ask the *deployed* server a real question through its own LLM paths and write
# the answer back into this branch as `probe-report.txt`, so the result can be
# read without the user copying anything.
#
# The server's API keys live in its .env; this job never sees them — only the
# reply text and which provider produced it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Base URL of the running server
        required: false
        default: http://node.waifly.com:27214
  push:
    branches: ["**"]
    paths: [".github/workflows/probe-live-llm.yml"]

permissions:
  contents: write

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ github.event.inputs.target || 'http://node.waifly.com:27214' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        run: |
          set +e
          R=probe-report.txt
          : > "$R"
          say() { echo "$@" | tee -a "$R"; }
          # A blank line used to mean three different things: down, refused, or an
          # empty 200. Now every probe records the HTTP code, curl's exit status and
          # curl's own error text — `000` with exit 7 is refused, exit 28 is a
          # timeout, and "could not resolve host" is DNS. Different fixes entirely.
          get() {
            url="$1"; lim="${2:-25}"
            curl -sS -o /tmp/body.txt -w '%{http_code}' -m "$lim" "$url" > /tmp/code.txt 2>/tmp/err.txt
            cx=$?
            code=$(cat /tmp/code.txt 2>/dev/null)
            body=$(head -c 300 /tmp/body.txt 2>/dev/null | tr '\n' ' ')
            say "→ HTTP ${code:-none} · curl_exit=$cx · $(head -c 160 /tmp/err.txt 2>/dev/null)"
            say "  body: ${body:-<empty>}"
            printf '%s' "$code" > /tmp/last_code
            printf '%s' "$cx" > /tmp/last_cx
          }
          say "# live probe — $(date -u +%FT%TZ)"
          say "target: $TARGET"
          say ""

          hostport=$(printf '%s' "$TARGET" | sed -E 's#^https?://##; s#/.*$##')
          hostp="${hostport#*://}"; host="${hostport%%:*}"; port="${hostport##*:}"
          [ "$port" = "$host" ] && port=80
          say "## reachability of $host:$port (before any HTTP)"
          getent hosts "$host" >/tmp/dns.txt 2>&1; dx=$?
          say "dns(getent) exit=$dx · $(head -c 200 /tmp/dns.txt | tr '\n' ' ')"
          if timeout 8 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/tmp/tcp.err; then
            say "tcp connect: OPEN ✓"
          else
            say "tcp connect: FAILED · $(head -c 160 /tmp/tcp.err)"
            say ""
            say "VERDICT: UNREACHABLE — المنفذ مقفول/مفيش رد أصلاً. مفيش معنى لأي كلام عن «باندل قديم» قبل ما السيرفر يرجع."
            say "على Waifly: الـConsole → app → هو Running؟ الـport اللي المنصة بتربطه هو $port؟ أي إعادة deploy فاشلة بتسيبه App stopped."
            say ""
          fi
          say ""

          say "## /api/health"
          get "$TARGET/api/health"; say ""

          say "## /api/nova-core/status"
          curl -sS -m 30 "$TARGET/api/nova-core/status" | tee -a "$R"; say ""

          say "## /api/nova-core/council/ping (new bundle only)"
          curl -sS -m 60 "$TARGET/api/nova-core/council/ping" | head -c 2000 | tee -a "$R"; say ""

          say "## POST /api/multi-ai/chat  (real model call, SSE)"
          curl -sS -N -m 90 -X POST "$TARGET/api/multi-ai/chat" \
            -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Reply with exactly: PONG"}],"maxTokens":20}' \
            | head -c 2500 | tee -a "$R"; say ""

          say "## POST /api/nova-core/chat  (ready event names the provider)"
          curl -sS -N -m 120 -X POST "$TARGET/api/nova-core/chat" \
            -H 'content-type: application/json' \
            -d '{"message":"اكتب كلمة واحدة بس: تمام","history":[]}' \
            | grep -E '^event:|^data:' | head -30 | tee -a "$R"; say ""

          say "## POST /api/nova-core/council (new bundle only)"
          curl -sS -m 120 -X POST "$TARGET/api/nova-core/council" \
            -H 'content-type: application/json' \
            -d '{"message":"إيه أول خطوة في فحص نطاق مصرّح به؟ سطرين بالكتير."}' \
            | head -c 3000 | tee -a "$R"; say ""

          say "## engine stamp — is the deployed bundle the ops build at all?"
          V=$(curl -sS -m 20 "$TARGET/api/ops/version" 2>/dev/null | head -c 1200 || true)
          say "$V"
          say ""
          if [ ! -s /tmp/body.txt ] || [ "$(cat /tmp/last_code 2>/dev/null)" = "000" ]; then
            say "VERDICT: UNREACHABLE — مافيش رد على /api/ops/version خالص؛ ده سقطة سيرفر مش باندل قديم."
          elif echo "$V" | grep -q '"opsRouter"'; then
            say "VERDICT: ops engine LIVE on this host."
            echo "$V" | grep -q '"suspect":true' && say "VERDICT+: الـbundle قديم شوية — محتاج redeploy للفرع الأخير."
          else
            say "VERDICT: PRE-OPS bundle — السيرفر ده لسه مفيهوش محرك /api/ops (لا scope gate ولا jobs ولا أدلة)."
            say "الإصلاح: اعمل deploy من الفرع/PR اللي فيه `src/lib/ops/` ثم restart، وبعدها الـprobe ده لازم يطلع opsRouter:true"
          fi
          say ""

          say "## ops surface (200 = live, 404 = old bundle, HTML = SPA fallthrough = مش راوتر)"
          for ep in kinds programs stats sweep provision; do
            say "GET /api/ops/$ep"
            get "$TARGET/api/ops/$ep" 20
          done
          say ""

          say "## the gate must refuse an anonymous stranger"
          say "POST /api/ops/programs (anonymous write — must be 403)"
          curl -sS -o /tmp/deny.json -w '%{http_code}' -m 25 -X POST "$TARGET/api/ops/programs" \
            -H 'content-type: application/json' -d '{"id":"probe-only","hosts":["example.com"]}' > /tmp/c1 2>/tmp/e1 || true
          c1=$(cat /tmp/c1); say "  HTTP ${c1:-none} · $(head -c 200 /tmp/deny.json 2>/dev/null | tr -d "\n")$(head -c 80 /tmp/e1 2>/dev/null)"
          if [ "$c1" = "403" ]; then say "  → البوابة شغالة على الهوست ✅"
          elif [ "$c1" = "200" ] || [ "$c1" = "201" ]; then say "  → ⚠️⚠️ الكتابة المجهولة مقبولة: الهوست مكشوف لأي حد على الإنترنت"
          elif [ -z "$c1" ] || [ "$c1" = "000" ]; then say "  → مفيش رد أصلاً (سيرفر واقع؟) — مافيش استنتاج"
          else say "  → HTTP $c1 (مش 403): يا باندل قديم يا route ناقص"; fi
          say "POST /api/local-agent/exec (anonymous — هذا هو الاختبار الحساس)"
          curl -sS -o /tmp/deny2.json -w '%{http_code}' -m 20 -X POST "$TARGET/api/local-agent/exec" \
            -H 'content-type: application/json' -d '{"command":"id"}' > /tmp/c2 2>/tmp/e2 || true
          c2=$(cat /tmp/c2); say "  HTTP ${c2:-none} · $(head -c 200 /tmp/deny2.json 2>/dev/null | tr -d "\n")"
          if echo "$(cat /tmp/deny2.json 2>/dev/null)" | grep -q "uid="; then
            say "  → 🚨 تنفيذ أمر حقيقي رجّع output لمن لا أعرفه — اقطع الهوست فوراً ودوّر المفاتيح"
          fi
          say ""

          say "## self-provisioning state (keys loaded? scope seeded?)"
          curl -sS -m 20 "$TARGET/api/ops/provision" | head -c 500 | tee -a "$R"
          say ""
          say "## background loop + toolchain on the hub"
          curl -sS -m 20 "$TARGET/api/ops/sweep" | head -c 400 | tee -a "$R"
          say ""
          curl -sS -m 20 "$TARGET/api/tools/corpus-status" 2>/dev/null | head -c 260 | tee -a "$R" || true
          say ""

          say "## free-plane catalogue + honest fleet ceiling"
          curl -sS -m 20 "$TARGET/api/fleet/capabilities" | head -c 420 | tee -a "$R"
          say ""
          curl -sS -m 20 "$TARGET/api/fleet/catalogue" | head -c 260 | tee -a "$R"
          say ""

          say "## fleet"
          curl -sS -m 20 "$TARGET/api/local-agent/agents" | tee -a "$R"; say ""
          curl -sS -m 20 "$TARGET/api/fleet/mesh" | head -c 800 | tee -a "$R"; say ""

      # The report is written back INTO the branch on purpose: the sandbox I
      # (the agent) work in cannot reach this host nor Actions' log storage, so a
      # committed file is the one channel that always survives. It must therefore
      # tolerate the branch moving while the probe ran — a plain push used to fail
      # non-fast-forward and the report was lost.
      - name: Publish report to the branch
        run: |
          set -e
          git config user.name "nova-probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-report.txt
          git commit -m "chore(probe): live report from CI [skip ci]" --quiet || { echo "nothing to publish"; exit 0; }
          branch="${{ github.ref_name }}"
          for try in 1 2 3; do
            if git push origin "HEAD:$branch" --quiet; then
              echo "report published on attempt $try"
              exit 0
            fi
            echo "push rejected (branch moved?) — rebasing onto origin/$branch and retrying"
            git fetch origin "$branch" --quiet && git rebase "origin/$branch" --quiet || git rebase --abort || true
            sleep $((try * 4))
          done
          echo "::warning::could not publish probe-report.txt — the report is still in this job log"
          exit 0
