# TEST65 — فكس العطل الحي 12:06Z: الهَب شغال بكود قديم (900fd30) والأبديتر في
# backoff (نفس الحزمة فشلت 7/7) — الكود نفسه بيقول الحل: POST ?force=1.
# POST من الrunner شغال (مقاس 09:33-09:36 في kali-tools-install) — من السانبوكس مفصول.
name: hub force update (bypass backoff → TEST60 bundle)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hub-force-update.yml"
permissions:
  contents: read
concurrency:
  group: hub-force-update-r2
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOKEN: ${{ secrets.NOVA_EXEC_TOKEN }}
      HUB: https://nova.waifly.com
    steps:
      - name: wait for standalone-bundle to publish nova-bundle + force auto-update
        run: |
          sleep 75
          R=$(curl -s --max-time 300 -w "\nHTTP:%{http_code}" -X POST "$HUB/api/nova-core/auto-update?force=1" \
            -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{}')
          echo "::notice::force-update: $(echo "$R" | tail -c 400 | tr -d '\n\r')"
      - name: wait for the reboot + read the new boot commit
        run: |
          sleep 35
          for i in 1 2 3 4 5 6; do
            V=$(curl -s --max-time 30 "$HUB/api/nova-core/version?token=$TOKEN&i=$i")
            BOOT=$(echo "$V" | grep -o '"boot":{"commit":"[^"]*"' | cut -d'"' -f6)
            DISK=$(echo "$V" | grep -o '"disk":{"commit":"[^"]*"' | cut -d'"' -f6)
            UP=$(echo "$V" | grep -o '"uptimeSec":[0-9]*' | cut -d: -f2)
            PERMS_CHK=$(curl -s --max-time 15 "$HUB/api/live-agent/permissions?token=$TOKEN")
            TCOUNT=$(echo "$PERMS_CHK" | grep -o '"totalTools":[0-9]*' | cut -d: -f2)
            echo "::notice::boot=$BOOT disk=$DISK tools=$TCOUNT uptime=${UP}s (محاولة $i)"
            if [ "$TCOUNT" = "96" ]; then
              echo "::notice::✓ الهَب اقفل على النسخة السيادية الجديدة (96 أداة): boot=$BOOT uptime=${UP}s"
              break
            fi
            echo "النسخة على الهَب لسه قديمة (boot=$BOOT tools=$TCOUNT) — نطلب auto-update?force=1 ثم restart?force=1"
            curl -s --max-time 180 -X POST "$HUB/api/nova-core/auto-update?force=1" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{}' || true
            sleep 25
            curl -s --max-time 20 -X POST "$HUB/api/nova-core/restart?force=1" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{}' || true
            sleep 35
          done
      - name: terminal exec test (TEST70 — الفشل المحلي ينزل للأسطول)
        run: |
          sleep 20
          R=$(curl -s --max-time 120 -X POST "$HUB/api/kali-env/exec" \
            -H "x-nova-token: $TOKEN" -H "content-type: application/json" \
            -d '{"command":"echo TERMINAL_OK && uname -a"}')
          echo "::notice::exec: $(echo "$R" | tr -d '\n\r' | tail -c 400)"

      - name: measure Sovereign Live Lab + 426 Vulns Matrix + Exploit Mutation/Fusion + 16 Books + Root Permissions
        run: |
          sleep 15
          PERMS=$(curl -s --max-time 25 "$HUB/api/live-agent/permissions?token=$TOKEN" | head -c 340)
          echo "::notice::live-agent-permissions-2099: $(echo "$PERMS" | tr -d '\n\r')"
          LAB=$(curl -s --max-time 25 "$HUB/api/live-agent/sovereign-lab?target=example.com&token=$TOKEN" | head -c 380)
          echo "::notice::sovereign-lab-2099: $(echo "$LAB" | tr -d '\n\r')"
          CONSULT=$(curl -s --max-time 40 -X POST "$HUB/api/live-agent/sovereign-lab/consult" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{"target":"example.com","mode":"root-full-attack","customDirective":"فحص روت كامل ودمج قاعدة الـ426 ثغرة","executeLive":true}' | head -c 380)
          echo "::notice::sovereign-consult-2099: $(echo "$CONSULT" | tr -d '\n\r')"
          V426=$(curl -s --max-time 25 "$HUB/api/live-agent/vulns-426?limit=3&token=$TOKEN" | head -c 380)
          echo "::notice::vulns-426-2099: $(echo "$V426" | tr -d '\n\r')"
          FUSE=$(curl -s --max-time 40 -X POST "$HUB/api/live-agent/vulns-426/mutate-and-fuse" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{"vulnIds":["VULN-426-001","VULN-426-098","VULN-426-162"],"target":"example.com","condition":"waf-cloudflare","mode":"root-full-attack","executeLive":true}' | head -c 380)
          echo "::notice::vulns-426-fuse-2099: $(echo "$FUSE" | tr -d '\n\r')"
          BOOKS=$(curl -s --max-time 25 "$HUB/api/live-agent/books?token=$TOKEN" | head -c 360)
          echo "::notice::books-library-2099: $(echo "$BOOKS" | tr -d '\n\r')"
          TRAIN=$(curl -s --max-time 25 -X POST "$HUB/api/live-agent/books/train" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{"bookId":"book-kali-revealed-2099","target":"example.com"}' | head -c 360)
          echo "::notice::books-train-2099: $(echo "$TRAIN" | tr -d '\n\r')"
          AG_LAB=$(curl -s -N --max-time 25 -X POST "$HUB/api/live-agent/sessions/nova-root/messages" -H "x-nova-token: $TOKEN" -H "content-type: application/json" -d '{"content":"شغّل المختبر السيادي الحي sovereign_live_lab وقاعدة الـ426 ثغرة kali_vuln_426_matrix ودمج الثغرات kali_exploit_mutate_fuse وتدريب الكتب kali_books_trainer على example.com","mode":"auto"}' | tr '\n\r' ' ' | head -c 520)
          echo "::notice::live-agent-sovereign-tools-2099: $AG_LAB"
          T=$(curl -s --max-time 120 "$HUB/api/kali-env/tools?token=$TOKEN")
          echo "::notice::tools: $(echo "$T" | grep -o '"total":[0-9]*' | head -1) · $(echo "$T" | grep -o '"present":[0-9]*' | head -1)"
          H=$(curl -s --max-time 60 "$HUB/api/kali-env/health?token=$TOKEN" | head -c 300)
          echo "::notice::health: $(echo "$H" | tr -d '\n\r')"
