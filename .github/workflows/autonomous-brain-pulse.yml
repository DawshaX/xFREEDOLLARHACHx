name: CyberNova 24/7 Autonomous Cloud Brain Pulse

on:
  schedule:
    # Hourly: the public repo's Actions minutes are free, each run is ~30s, and
    # NVD allows 5 requests / 30s — one per hour is far below that.
    - cron: "0 * * * *"
  workflow_dispatch:
  # Run once whenever the pulse itself changes, so a fresh version is proven
  # immediately instead of waiting up to six hours. State commits by the bot
  # only touch state/, which is not in `paths`, so this cannot loop.
  push:
    branches: [main]
    paths:
      - "scripts/autonomous-brain-pulse.mjs"
      - "scripts/ci-commit.mjs"
      - ".github/workflows/autonomous-brain-pulse.yml"

permissions:
  contents: write

jobs:
  cloud-brain-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute Autonomous Cloud Brain Pulse
        run: node scripts/autonomous-brain-pulse.mjs

      # A raw push here loses the checkpoint whenever another job pushed first —
      # rejected, exit 1, no annotation, state gone (measured on live-mission, the
      # same shape). ci-commit rebases with autostash and proves the push landed.
      - name: Commit & Push Updated Cloud Memory State
        env:
          MSG: "chore(cloud-brain): autonomous 24/7 pulse checkpoint [skip ci]"
        run: |
          node scripts/ci-commit.mjs --allow-empty --message "$MSG" \
            state/cybernova-brain-state.json artifacts/kali-panel/public/state/cybernova-brain-state.json
