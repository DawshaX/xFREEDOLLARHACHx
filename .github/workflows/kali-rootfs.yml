# ─────────────────────────────────────────────────────────────────────────────
# بيئة كالي الحقيقية المدمجة — rootfs كامل بيتبنى هنا ويترفع لفرع kali-rootfs.
# ليه هنا؟ السانبوكس/البرنامج نتّه محجوب على kali CDN، لكن الRunner نتّه مفتوح
# ⇒ بنبني هنا وننقل بالgit (github.com مسموح محليًا). الأجزاء ≤90MB
# (حد جيت هب للملف الواحد 100MB). الاستخراج المحلي: scripts/kali-rootfs-fetch.sh
# ─────────────────────────────────────────────────────────────────────────────
name: Kali embedded env (real rootfs)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kali-rootfs.yml"
      - "scripts/kali-rootfs-build.sh"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - name: Bootstrap git (الcheckout محتاجه)
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: سطب كالي الحقيقي وابني الأجزاء
        run: bash scripts/kali-rootfs-build.sh
        env:
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}

      - name: ارفع الفرع kali-rootfs (رفع تجزيدي — جزء لكل push، الضخامة الواحدة قتلت run 43570109294)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(ls /out/part-* 2>/dev/null | wc -l)
          echo "::notice::parts=$N"
          if [ "$N" -lt 1 ]; then
            echo "::error::مافيش أجزاء في /out"
            exit 1
          fi
          mkdir -p /tmp/branchrepo && cd /tmp/branchrepo
          git init -q -b kali-rootfs
          cp /out/MANIFEST.txt /out/PACKAGES.txt /out/SHA256SUMS .
          git config user.name "nova-builder"
          git config user.email "nova@ci.local"
          git add -A
          git commit -qm "kali rootfs manifest — $(grep built_at /out/MANIFEST.txt | cut -d= -f2) parts=$N"
          git -c http.version=HTTP/1.1 -c http.postBuffer=157286400 push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kali-rootfs > /tmp/push0.log 2>&1 || { tail -4 /tmp/push0.log | while IFS= read -r l; do echo "::error::manifest push: $l"; done; exit 1; }
          echo "✔ المانيفست اترفع"
          i=0
          for f in /out/part-*; do
            i=$((i+1))
            cp "$f" .
            git add "$(basename "$f")"
            git commit -qm "kali part $(basename "$f") — $i/$N"
            OK=""
            for try in 1 2 3; do
              git -c http.version=HTTP/1.1 -c http.postBuffer=157286400 push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kali-rootfs > /tmp/push.log 2>&1 && OK=1 && break
              sleep 8
            done
            if [ -z "$OK" ]; then
              tail -3 /tmp/push.log | while IFS= read -r l; do echo "::error::push $(basename "$f"): $l"; done
              exit 1
            fi
            echo "  ✔ $(basename "$f") ($i/$N)"
          done
          echo "✔ كل الأجزاء ($N) اترفعت تجزيديًا — مقاس من نجاح آخر push"

      - name: أجزاء البناء (للتنزيل اليدوي كمان)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kali-rootfs-parts
          path: |
            /out/part-*
            /out/MANIFEST.txt
          retention-days: 7
