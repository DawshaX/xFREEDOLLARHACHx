name: advisory library (real GHSA corpus)

# The dashboard used to print 75,879 CVEs over a 22-row array. This job is the
# replacement: it pulls the real GitHub Advisory Database, proves the library is
# measured, and commits the (severity-filtered) corpus the app ships with.
on:
  schedule:
    - cron: "17 4 * * *" # daily, off-peak
  workflow_dispatch:
    inputs:
      pages:
        description: "pages of 100 advisories to pull"
        default: "20"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/src/lib/ops/advisory-library.ts"
      - "scripts/test-advisory-library.mjs"
      - ".github/workflows/advisory-library.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: advisory-library
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub keeps the commit a run was QUEUED with; a run that waits behind
      # concurrency: starts on state that is already old, decides its next step
      # from it, and then writes that stale state back over the newer one.
      # Measured: run 41905819968 queued 20:21:25 on 27a0fede, started 20:31:07
      # after the 20:30:56 index commit, and re-ran the same work (walkedFrom 0).
      - name: move to the current origin/${{ github.ref_name }} (a queued run starts on a stale commit)
        run: |
          git fetch --prune origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          git log -1 --format='now on %h · %s'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: real sync + proofs (20 checks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_EXTRA_CA_CERTS: ""
        run: node scripts/test-advisory-library.mjs

      - name: sync the shipped corpus (critical + high only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_ADVISORY_MIN_SEVERITY: high
          NOVA_ADVISORY_CACHE: state/advisory-cache.json
          PAGES: ${{ github.event.inputs.pages || '20' }}
        run: |
          node scripts/advisory-sync-cli.mjs "$PAGES"
          ls -la state/advisory-cache.json

      - name: report measured numbers (never a claim)
        run: |
          node -e '
            const c = require("./state/advisory-cache.json");
            const s = Object.entries(c.bySeverity).map(([k,v])=>`${k}: ${v}`).join(" · ");
            console.log(`measured ${c.total} advisories in ${c.pages} page(s) at ${c.at}`);
            console.log(`by severity → ${s}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Advisory library (measured)\n\n| | |\n|---|---|\n| rows stored | **${c.total}** |\n| pages | ${c.pages} |\n| synced at | ${c.at} |\n| by severity | ${s} |\n| source | ${c.source} |\n`);
          '

      - name: commit the corpus
        env:
          # a colon inside an unquoted YAML scalar ("chore(corpus): …") makes the
          # whole workflow file invalid — pass the message through env instead
          MSG: "chore(advisory): real GHSA corpus $(date -u +%Y-%m-%d) [skip ci]"
        run: |
          node scripts/ci-commit.mjs --message "$MSG" state/advisory-cache.json
