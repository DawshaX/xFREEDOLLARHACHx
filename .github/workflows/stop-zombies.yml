# TEST62b — أمر المالك: إلغاء كل العقد القديمة كلها — بيلاقي أي run fleet حي ويلغيه
# (github.token جوه الActions عنده actions:write — الطريقة الوحيدة المثبتة).
name: "fleet rescale (kill ALL old nodes) — TEST93e سباتور الجمود"
on:
  push:
    paths:
      - ".github/workflows/stop-zombies.yml"
permissions:
  actions: write
  contents: read
concurrency:
  # TEST93f — group فريد لكل commit: الrescale pushes المتعددة يتنافسوا كلهم
  # على السلات بدل ما يطابوروا ورا بعض (الجمود المقاس: العقد ال19 ماسكة كل خانة)
  group: "stop-zombies-${{ github.sha }}"
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: cancel EVERY live fleet run (old nodes die — fresh 10 next push)
        run: |
          sleep 20   # استنى الموجة الجديدة اللي ممكن تكون قامت بنفس الpush
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=40" \
            | jq -r '.workflow_runs[] | select((.name | test("fleet")) and (.name | test("rescale") | not)) | select(.status != "completed") | .id')
          for R in $RUNS; do
            [ "$R" = "$GITHUB_RUN_ID" ] && continue
            echo "→ cancel live fleet run $R:"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}/actions/runs/$R/cancel" | head -c 80
            echo
          done
          echo "✓ كل العقد القديمة اتلغت — الجاية 10 نضيفة"
# TEST62c — retrigger (أمر المالك: العشر عقد لازم تشتغل مع بعض)
# TEST64g — retrigger: العقد الجديدة بتسحب المخزن الكامل 18b8817 (96 جزء · 2568 حزمة)
# TEST66 — retrigger: المخزن السليم 1083de4 (94 جزء · 2563 حزمة · مسارات الجذر)
# TEST67 — retrigger: العقد بج Guests مكسورة من المنافسة — الموجة الجاية بسقف 30د
