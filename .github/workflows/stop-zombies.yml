# TEST62 — إلغاء موجة ال19 عقدة (الأمر الجديد: 10 بس) — github.token جوه
# الActions عنده actions:write على نفس الrepo (مقاس 08:14Z — أعقد طريقة نجحت).
name: fleet rescale (cancel the 19-wave)
on:
  push:
    paths:
      - ".github/workflows/stop-zombies.yml"
permissions:
  actions: write
  contents: read
concurrency:
  group: stop-zombies
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: cancel the old 19-node wave (superseded by the 10-node order)
        run: |
          for R in 44266917184; do
            echo "→ cancel $R:"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$R/cancel" | head -c 120
            echo
          done
