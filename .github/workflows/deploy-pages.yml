name: 🌐 نشر المنصة على GitHub Pages (تحديث لحظي تلقائي)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build CyberNova Platform for GitHub Pages
        env:
          PORT: "3000"
          BASE_PATH: "/xFREEDOLLARHACHx/"
        run: |
          pnpm --filter @workspace/kali-panel run build
          cp artifacts/kali-panel/dist/public/index.html artifacts/kali-panel/dist/public/404.html
          touch artifacts/kali-panel/dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "artifacts/kali-panel/dist/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
