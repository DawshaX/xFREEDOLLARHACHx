name: 🌐 نشر المنصة على GitHub Pages (تحديث لحظي تلقائي)

on:
  push:
    branches: ["main"]
  # The state-writing workflows commit with `[skip ci]`, so GitHub never fires a
  # push event for those commits and Pages keeps serving the PREVIOUS state file.
  # Measured 2026-11-04: the corpus index was committed at 21:36 (144,000 rows)
  # while https://dawshax.github.io/…/state/vuln-corpus-live.json still answered
  # 120,000 from the 21:11 deploy — the data was real, it was just unpublished.
  # workflow_run fires after the state workflow finishes (success or failure — the
  # commit exists either way), so the site rebuilds from the new branch head.
  workflow_run:
    workflows:
      - "vuln corpus (real NVD + KEV + EPSS)"
      - "advisory library (real GHSA corpus)"
      - "hunt live (real scan · permitted targets)"
      - "NOVA portable bundle (24/7)"
      # The same `[skip ci]` hole, measured by scripts/check-workflows.mjs (which
      # now fails if a skip-ci state committer is missing from this list):
      - "CyberNova 24/7 Autonomous Cloud Brain Pulse"
      - "backend health (the edge function, measured from outside)"
      - "NOVA live mission"
      - "probe-live-llm"
      - "NOVA brain (keyless · thinks every 15 min)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # false, not true: cancelling a workflow that is mid-deploy orphans its Pages
  # deployment in "in progress", and an orphaned one blocks every later deploy.
  # That is exactly what happened here — runs 41907982125 (20:35) and 41908195373
  # (20:38) both died with "Deployment request failed … due to in progress
  # deployment. Please cancel 27a0fede… first". GitHub's own pages template uses
  # false for the same reason.
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always the branch head, never `github.sha`. A `workflow_run` deploy is
      # handed the SHA of the run that triggered it, so deploying "its" commit
      # publishes the state from BEFORE the commit that run just made (measured
      # 2026-11-04 21:59: the brain committed at 21:59:08 and the deploy aimed at
      # the previous SHA). This workflow only ever deploys the default branch.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # Reported, not enforced, HERE. This job is the live site: blocking it on a
      # type-error count means a `@types` minor bump in CI (install runs with
      # --no-frozen-lockfile) takes the whole platform offline. The blocking gate
      # lives in `NOVA live audit → quality-gate`, which goes red without hurting
      # anybody. Measured on main 2026-11-02: this step went red at 99=baseline
      # locally, i.e. CI noise — and it killed the Pages deploy.
      - name: 🧱 Typecheck ratchet (reported; blocking gate is in live-audit)
        run: node scripts/typecheck-ratchet.mjs || echo "::warning::typecheck ratchet above baseline — see the quality-gate job in 'NOVA live audit'; deploy continues"

      - name: 🧾 Workflow files are valid YAML (a bad colon broke 3 jobs once)
        run: node scripts/check-workflows.mjs

      - name: 🧪 Ops engine self-test (scope gate must refuse out-of-scope)
        run: node scripts/ops-selftest.mjs

      - name: 🛡️ Audit API connections & contracts
        run: pnpm run audit:connections

      - name: Build CyberNova Platform for GitHub Pages
        env:
          PORT: "3000"
          BASE_PATH: "/xFREEDOLLARHACHx/"
        run: |
          pnpm --filter @workspace/kali-panel run build
          cp artifacts/kali-panel/dist/public/index.html artifacts/kali-panel/dist/public/404.html
          for route in bug-bounty-studio vuln-encyclopedia code-auditor dashboard desktop kali-terminal mission-tracker vuln-center scanner agent live-agent memory reports nova-fleet; do
            mkdir -p "artifacts/kali-panel/dist/public/$route"
            cp artifacts/kali-panel/dist/public/index.html "artifacts/kali-panel/dist/public/$route/index.html"
          done
          MAIN_JS=$(ls artifacts/kali-panel/dist/public/assets/index-*.js | head -n 1)
          if [ -n "$MAIN_JS" ]; then
            for legacy in index-CMmVbNSt.js index-CJk1-AWH.js index-D71ndo2S.js index-B_VWTFD7.js index-DVekdyJC.js index-CTWUYsNj.js index-CGaem1qQ.js index-BOeZlOmc.js index.js; do
              cp "$MAIN_JS" "artifacts/kali-panel/dist/public/assets/$legacy" || true
            done
          fi
          touch artifacts/kali-panel/dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "artifacts/kali-panel/dist/public"

      # The orphan above already exists and waiting does not clear it, so clear it
      # here: this job holds pages:write and can cancel a deployment that nothing
      # is driving any more. If the API refuses, the step says so and lets
      # deploy-pages report the failure — a silent no-op would hide the site.
      # Measured 2026-11-04 21:59→22:10: this step cancelled a deployment that was
      # still LIVE (its run was queued behind us, not dead), left it in
      # `deployment_in_progress`, and the next deploy waited nine minutes for a
      # lock nobody held. It also exited 5 once and blocked the site for nothing
      # (run 22:11), so it is now best-effort by construction: wait, then cancel
      # what is still stuck, and never be the reason the site does not deploy.
      - name: clear a stuck Pages deployment (one orphan blocks every deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          list() { gh api "repos/$REPO/pages/deployments?per_page=20" 2>/dev/null; }
          busy() {
            list | jq -r '(.page_deployments? // .)[]? | select(.status == "deployment_in_progress" or .status == "deployment_queued") | .id' 2>/dev/null
          }
          probe=$(list)
          if [ -z "$probe" ]; then
            echo "cannot list Pages deployments from this token — letting deploy-pages report the truth"
            exit 0
          fi
          waited=0
          while [ "$waited" -lt 240 ]; do
            stuck=$(busy)
            if [ -z "$stuck" ]; then
              echo "no deployment in progress after ${waited}s"
              exit 0
            fi
            echo "another deployment is still working (${waited}s): $(echo $stuck | tr '\n' ' ')"
            sleep 15
            waited=$((waited + 15))
          done
          stuck=$(busy)
          if [ -z "$stuck" ]; then
            exit 0
          fi
          for id in $stuck; do
            echo "deployment $id is still in progress after ${waited}s — cancelling it"
            gh api --method POST "repos/$REPO/pages/deployments/$id/cancel" >/dev/null 2>&1 \
              && echo "  cancelled $id" || echo "  could not cancel $id (deploy-pages will say why)"
          done
          sleep 10
          exit 0

      # Measured 2026-11-05: six consecutive deploys failed with GitHub's own
      # "Deployment failed, try again" while the build, the artifact and the
      # clear-stuck step all passed. The site kept serving an older build and the
      # panel fixes never reached it. Pages intermittently refuses a deployment
      # that nobody is driving; the answer GitHub's own error gives is «try
      # again», so this job now takes it literally — once, after a pause, and only
      # if the first attempt failed. `continue-on-error` keeps the first failure
      # from ending the job before the retry can run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: wait before retrying — GitHub itself says «try again»
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
