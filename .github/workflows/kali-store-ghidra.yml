# TEST93p — store ghidra+retdec: أدوات الهندسة العكسية الثقيلة. ghidra zip من
# releases (NationalSecurityAgency/ghidra) → /opt/ghidra + wrappers (ghidraRun
# بيثّب openjdk-21 لو ناقص — الجست ماعندهوش java). retdec tar.xz من releases
# (avast/retdec) → /opt/retdec + symlinks. كل مرحلة بلوج صريح يتكوميت دايمًا
# (الدرس: اللوج من results-receiver EOF — الكوميت هو اللوج الموثوق).
name: "kali store ghidra+retdec v6 (retdec-decompiler.py → release kali-store)"
on:
  push:
    paths:
      - ".github/workflows/kali-store-ghidra.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kali-store-ghidra-v6
  cancel-in-progress: false
jobs:
  re:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: بناء ghidra.tar.gz + retdec.tar.gz
        continue-on-error: true
        run: |
          mkdir -p store state
          WORK="$GITHUB_WORKSPACE"
          # ── ghidra ──
          GURL=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest --jq '.assets[].browser_download_url' 2>/dev/null | grep '_PUBLIC_.*\.zip' | head -1)
          echo "ghidra URL=$GURL" | tee -a state/kali-store-ghidra.log
          if [ -n "$GURL" ]; then
            if curl -sfL --retry 3 -m 1200 "$GURL" -o /tmp/ghidra.zip; then
              rm -rf /tmp/gz /opt/ghidra && mkdir -p /tmp/gz
              unzip -q /tmp/ghidra.zip -d /tmp/gz && mv /tmp/gz/ghidra_* /opt/ghidra
              printf '#!/bin/sh\ncommand -v java >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless >/dev/null 2>&1 || DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jre-headless >/dev/null 2>&1 || true)\nexec /opt/ghidra/ghidraRun "$@"\n' > /usr/local/bin/ghidraRun
              printf '#!/bin/sh\ncommand -v java >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless >/dev/null 2>&1 || true)\nexec /opt/ghidra/support/analyzeHeadless "$@"\n' > /usr/local/bin/analyzeHeadless
              cp /usr/local/bin/ghidraRun /usr/local/bin/ghidra
              chmod +x /usr/local/bin/ghidraRun /usr/local/bin/analyzeHeadless /usr/local/bin/ghidra
              (cd / && tar czf "$WORK/store/ghidra.tar.gz" opt/ghidra usr/local/bin/ghidraRun usr/local/bin/analyzeHeadless usr/local/bin/ghidra) && echo "OK:ghidra $(stat -c%s "$WORK/store/ghidra.tar.gz")" | tee -a state/kali-store-ghidra.log || echo "FAIL:ghidra-tar" | tee -a state/kali-store-ghidra.log
            else
              echo "FAIL:ghidra-download $(ls -la /tmp/ghidra.zip 2>/dev/null)" | tee -a state/kali-store-ghidra.log
            fi
          else
            echo "MISS:ghidra (لا URL — rate limit؟)" | tee -a state/kali-store-ghidra.log
          fi
          # ── retdec ──
          RURL="https://github.com/avast/retdec/releases/download/v5.0/RetDec-v5.0-Linux-Release.tar.xz"  # مخبوز — gh api للريبو ده بيقع على الrunner (مقاس v2/v3/v4)
          echo "retdec URL=$RURL" | tee -a state/kali-store-ghidra.log
          if [ -n "$RURL" ]; then
            if curl -sfL --retry 3 -m 1200 "$RURL" -o /tmp/retdec.tar.xz; then
              rm -rf /opt/retdec /opt/retdec-* /opt/RetDec-*
              mkdir -p /opt/retdec && tar xJf /tmp/retdec.tar.xz -C /opt/retdec --strip-components=1
              REBIN=$(find /opt/retdec -maxdepth 3 \( -name 'retdec-decompiler*' -o -name 'retdec-decompiler.py' \) -path "*bin*" 2>/dev/null | head -1)
              echo "retdec bin=$REBIN" | tee -a state/kali-store-ghidra.log
              if [ -n "$REBIN" ]; then
                ln -sf "$REBIN" /usr/local/bin/retdec-decompiler
                ln -sf "$REBIN" /usr/local/bin/retdec
                shopt -s nullglob
                PATHS=(opt/retdec usr/local/bin/retdec usr/local/bin/retdec-decompiler)
                (cd / && tar czf "$WORK/store/retdec.tar.gz" "${PATHS[@]}") && echo "OK:retdec $(stat -c%s "$WORK/store/retdec.tar.gz")" | tee -a state/kali-store-ghidra.log || echo "FAIL:retdec-tar" | tee -a state/kali-store-ghidra.log
              else
                echo "FAIL:retdec-bin-not-found $(ls /opt/retdec | head -5)" | tee -a state/kali-store-ghidra.log
              fi
            else
              echo "FAIL:retdec-download $(ls -la /tmp/retdec.tar.xz 2>/dev/null)" | tee -a state/kali-store-ghidra.log
            fi
          else
            echo "MISS:retdec (لا URL — rate limit؟)" | tee -a state/kali-store-ghidra.log
          fi
          ls -la store | tee -a state/kali-store-ghidra.log
          cp state/kali-store-ghidra.log store/build-ghidra.log 2>/dev/null || true
          exit 0
      - name: رفع التاربولات + اللوج
        continue-on-error: true
        run: |
          shopt -s nullglob
          ASSETS=(store/*.tar.gz store/build-ghidra.log)
          echo "re bundles: ${#ASSETS[@]}"
          gh release view kali-store -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create kali-store -R "$GITHUB_REPOSITORY" --title "kali-store — tarballs بدون dpkg" --notes "TEST93p"
          [ ${#ASSETS[@]} -gt 0 ] && gh release upload kali-store "${ASSETS[@]}" --clobber -R "$GITHUB_REPOSITORY" && echo "::notice::✓ ghidra+retdec: ${#ASSETS[@]}"
          exit 0
      - name: كوميت اللوج
        continue-on-error: true
        run: |
          git config user.name "nova-bot"; git config user.email "nova@bot.local"
          git add -f state/kali-store-ghidra.log; git commit -m "state: ghidra+retdec log [skip ci]" || true
          git pull --no-rebase --no-edit origin arena/1aad5cfd-xfreedollarhachx; git push origin HEAD:arena/1aad5cfd-xfreedollarhachx; exit 0
