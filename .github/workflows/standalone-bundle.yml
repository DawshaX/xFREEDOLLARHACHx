# ─────────────────────────────────────────────────────────────────────────────
# NOVA — build the portable 24/7 bundle and publish it as a Release asset.
#
# Why: free always-on hosts (Silly Development, Pterodactyl panels) give 256 MB
# RAM and 512 MB disk — a `pnpm install` would not fit. This workflow builds
# everything here (GitHub runners are free) and publishes a ~2.5 MB zip that
# runs with `node server.mjs`, no install, no build, no credit card.
#
# Download: Releases → "nova-portable" → nova-24-7.zip
#           (or Actions → this run → Artifacts)
# ─────────────────────────────────────────────────────────────────────────────
name: NOVA portable bundle (24/7)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/kali-panel/**"
      - "scripts/build-standalone.mjs"
      # الملفين دول بيتنسخوا جوه الحزمة نفسها (build-standalone.mjs:154 بينسخ
      # `ops/` و`scripts/fetch-toolchain.mjs`) — أي تعديل فيهم لازم يبعت حزمة
      # جديدة، ومن غير السطرين دول المكنة فضلت بشكر نسخةvendorer قديمة بعد
      # a184874 (اللي صلّح `const latest` الناقص) والفرق كان 12 أداة مش منصوبة.
      - "scripts/fetch-toolchain.mjs"
      - "ops/**"
      - "state/**"
      - ".github/workflows/standalone-bundle.yml"
  workflow_dispatch:
  # دفعات GITHUB_TOKEN (زي تثبيت الـCA) مبتفجّرش push events — لكن workflow_run
  # بيشتغل عليها طبيعي (نفس النمط اللي deploy-pages بعتمد عليه)، فالشهادة
  # المثبّتة تركب الحزمة في الدقيقة نفسها مش على أول دفعة كود جاية.
  workflow_run:
    workflows: ["DB CA pin sync"]
    types: [completed]

concurrency:
  group: nova-standalone
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bundle:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build server + panel
        run: |
          pnpm --filter @workspace/api-server run build
          BASE_PATH=/ pnpm --filter @workspace/kali-panel run build

      - name: Assemble the portable folder
        run: node scripts/build-standalone.mjs

      - name: Build the fleet-node kit (one upload = a new node)
        run: node scripts/make-node-kit.mjs --hub wss://nova.waifly.com/api/local-agent/ws

      - name: 🔒 No secret may ride into a public release
        # An `.env` once shipped inside `api-server-windows-*.zip` with a live NOVA_EXEC_TOKEN and
        # nothing failed: the repo was clean, so every tracked-file check passed. The artifact is a
        # separate surface, and this is the only step that ever looks inside it. Fatal — a bundle
        # with a secret must not reach Releases, and a step conclusion is the only CI output a
        # sandbox can read.
        run: |
          node scripts/audit-bundle-secrets.mjs dist-standalone/nova-24-7
          node scripts/audit-bundle-secrets.mjs dist-node-kit

      - name: Smoke-test the bundle in a clean directory (no node_modules)
        run: |
          rm -rf /tmp/clean && mkdir -p /tmp/clean
          cd /tmp/clean && unzip -q "$GITHUB_WORKSPACE/dist-standalone/nova-24-7.zip"
          cd nova-24-7
          SERVER_PORT=8099 sh ./start.sh > /tmp/nova.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8099/api/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health → $code"
          [ "$code" = "200" ] || { echo "::error::portable bundle did not start"; tail -30 /tmp/nova.log; exit 1; }
          curl -s http://127.0.0.1:8099/api/nova-core/self-check | head -c 400
          echo
          node "$GITHUB_WORKSPACE/scripts/audit-live-server.mjs" 2>/dev/null || true
        env:
          AUDIT_URL: http://127.0.0.1:8099

      - uses: actions/upload-artifact@v4
        with:
          name: nova-24-7
          path: |
            dist-standalone/nova-24-7.zip
            dist-node-kit/nova-node-kit.zip
          retention-days: 90

      # Measured 2026-11-05: the bundle built, passed its own smoke test and
      # uploaded fine — and then this step failed, so the release kept the previous
      # zip. Everything downstream reads that zip: the live slot self-updates from
      # it, so a transient failure here silently freezes production on an old
      # build. GitHub's API was returning 502 for minutes at a time that afternoon
      # (the same window broke Pages deploys and PR merges), which is exactly the
      # kind of failure a retry is for.
      #
      # The body is repeated in the retry on purpose: a release published by the
      # second attempt must not come out with an empty description.
      - name: Publish as a release asset (stable download link)
        id: publish
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: nova-portable
          name: "NOVA — النسخة المحمولة 24/7"
          body: |
            حزمة جاهزة للتشغيل على أي استضافة مجانية **بدون تثبيت وبدون كارت**:

            1. نزّل `nova-24-7.zip` وفك الضغط.
            2. شغّل: `node server.mjs` (أو `sh start.sh`).
            3. البورت من `PORT` أو `SERVER_PORT`، والاستماع على `0.0.0.0`.
            4. لـHTTPS مجاني بدون حساب: `sh start-tunnel.sh`.

            الحجم ~10MB · الذاكرة ~90–110MB RSS · مفيش npm install ولا build.

            ---

            **نود الأسطول — `nova-node-kit.zip` (13 KB):**
            ملفات جاهزة تخلي أي سيرفر/جهاز تاني يبقى نود تابع للهاب.
            ارفع الملفات → خلّي Main file = `index.js` → Start.
            مفيش أي إعداد مطلوب (عنوان الهاب مدمج)، والاتصال صادر فمش محتاج IP عام.
            بديل بدون رفع: `curl -fsSL <hub>/api/local-agent/download-agent | bash -s -- --id node-2`
          files: |
            dist-standalone/nova-24-7.zip
            dist-node-kit/nova-node-kit.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: wait, then publish again — the first attempt is allowed to fail
        if: steps.publish.outcome == 'failure'
        run: sleep 60

      - name: Publish as a release asset (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-portable
          name: "NOVA — النسخة المحمولة 24/7"
          body: |
            حزمة جاهزة للتشغيل على أي استضافة مجانية **بدون تثبيت وبدون كارت**:

            1. نزّل `nova-24-7.zip` وفك الضغط.
            2. شغّل: `node server.mjs` (أو `sh start.sh`).
            3. البورت من `PORT` أو `SERVER_PORT`، والاستماع على `0.0.0.0`.
            4. لـHTTPS مجاني بدون حساب: `sh start-tunnel.sh`.

            الحجم ~10MB · الذاكرة ~90–110MB RSS · مفيش npm install ولا build.

            ---

            **نود الأسطول — `nova-node-kit.zip` (13 KB):**
            ملفات جاهزة تخلي أي سيرفر/جهاز تاني يبقى نود تابع للهاب.
            ارفع الملفات → خلّي Main file = `index.js` → Start.
            مفيش أي إعداد مطلوب (عنوان الهاب مدمج)، والاتصال صادر فمش محتاج IP عام.
            بديل بدون رفع: `curl -fsSL <hub>/api/local-agent/download-agent | bash -s -- --id node-2`
          files: |
            dist-standalone/nova-24-7.zip
            dist-node-kit/nova-node-kit.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: wait, then publish again — the first attempt is allowed to fail
        if: steps.publish.outcome == 'failure'
        run: sleep 60

      - name: Publish as a release asset (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-portable
          name: "NOVA — النسخة المحمولة 24/7"
          make_latest: false
          files: |
            dist-standalone/nova-24-7.zip
            dist-node-kit/nova-node-kit.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
