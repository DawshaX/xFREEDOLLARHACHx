# ─────────────────────────────────────────────────────────────────────────────
# CyberNova / NOVA — full stack, 100% free, runs unattended
#
#   docker compose up -d                 → panel + API  (built-in brain, no model)
#   docker compose --profile local-ai up -d  → + Ollama with a free local model
#
# Everything restarts itself (`restart: unless-stopped`) and the memory lives in
# a named volume, so a reboot or a redeploy never forgets anything.
# ─────────────────────────────────────────────────────────────────────────────
services:
  nova:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybernova:latest
    container_name: cybernova
    restart: unless-stopped
    ports:
      - "${NOVA_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      NOVA_MEMORY_FILE: /data/nova-memory.json
      # Local model (used when the local-ai profile is on)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # Free-tier keys (optional). Put them in a .env file next to this compose file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - nova-state:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    mem_limit: ${NOVA_MEM_LIMIT:-1500m}

  # Free local brain — CPU only, no key, no quota. Enable with:
  #   docker compose --profile local-ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: nova-ollama
    restart: unless-stopped
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_ORIGINS: "*"
    # Uncomment for NVIDIA GPUs (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Pulls the model once, then exits — idempotent.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"
    restart: "no"

  # ── Kali execution plane (added 2026-11-06) ────────────────────────────────
  # The tools that can never be a static binary — nmap, sqlmap, nikto, semgrep,
  # whatweb — live here. The platform host has no root and no apt, so this is
  # the only honest way to run them. No ports: it is an execution target, not a
  # server, and nothing new listens on the network.
  #
  #   docker compose up -d nova-kali
  #   docker compose exec nova-kali nmap --version
  #   docker compose exec nova-kali semgrep --version
  #
  # Enable with:  docker compose --profile kali up -d
  nova-kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: nova-kali:latest
    container_name: nova-kali
    restart: unless-stopped
    profiles: ["kali"]
    # Keep it alive so `docker compose exec` works; the image CMD is a smoke test.
    command: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - nova-scratch:/home/nova/scratch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nmap's SYN scan needs raw sockets. Drop this block and use `nmap -sT`
    # (TCP connect) if you would rather run fully unprivileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN

volumes:
  nova-state:
  ollama-models:
  nova-scratch:
