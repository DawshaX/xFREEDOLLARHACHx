# ─────────────────────────────────────────────────────────────────────────────
# Fly.io — real always-on machine with a persistent volume for long-term memory.
# NOTE (verified 2026-11-02): there is NO free allowance for new organisations
# any more — a trial of 2 VM-hours / 7 days, then pay-as-you-go (~$2.2-6.7/mo for
# a shared-cpu-1x machine). Keep this config for the paid path; for a $0 hub use
# Silly Development or GratisVPS (see docs/FREE-HOSTS-2026.md).
# After the first deploy, also: fly secrets set NOVA_EXEC_TOKEN=$(openssl rand -hex 16)
#
#   fly launch --copy-config --name cybernova-nova
#   fly volumes create nova_data --size 1 --region fra
#   fly deploy
# ─────────────────────────────────────────────────────────────────────────────
app = "cybernova-nova"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  NOVA_MEMORY_FILE = "/data/nova-memory.json"

[[mounts]]
  source = "nova_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the agent awake 24/7
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
