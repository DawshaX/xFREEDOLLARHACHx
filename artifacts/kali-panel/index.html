    <title>Cyber-Nova 2099 — Ethical Security & Bug Bounty Platform</title>
    <script>
      (function () {
        try {
          localStorage.removeItem("cybernova_home_activity_v2");
          window.addEventListener("error", function (e) {
            var msg = String((e && e.message) || "");
            if (
              (msg.indexOf("is not defined") !== -1 ||
                msg.indexOf("Failed to fetch dynamically imported module") !== -1 ||
                msg.indexOf("Importing a module script failed") !== -1) &&
              !sessionStorage.getItem("cybernova_hard_reload_v15")
            ) {
              sessionStorage.setItem("cybernova_hard_reload_v15", "1");
              var u = new URL(window.location.href);
              u.searchParams.set("_v", String(Date.now()));
              window.location.replace(u.toString());
            }
          });
        } catch (_err) {}
      })();
    </script>
